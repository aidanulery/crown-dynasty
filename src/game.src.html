<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crown &amp; Dynasty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Spectral:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE: a royal chronicle — grave, warm, candlelit.
   IDEA: a campaign table: an engraved sea chart under a gilded, paper-bound ledger with brass-framed tabs.
   PICTURE: the map fills the window; twelve gilded notches hang from the top edge.
   COLOUR and TYPE: aged, darkened paper with gilt edges, slate sea, oxblood accent; IM Fell for titles, Spectral for text.
   LAYOUT: top bar (brand · notches · stats), map beneath; pages open as paper sheets over the map. */
:root{color-scheme:light dark;
 --wood:#2b1d14;--paper:#a98b5e;--paper2:#987a4f;--ink:#1f1206;--muted:#3e2814;
 --sea:#1f3437;--sea2:#1a2c2f;--land:#c2ae82;--coast:#5b4128;--accent:#8a1f1f;--gold:#b8892d;--line:#7a5c34;
 --paperimg:none;
 --gilt:linear-gradient(135deg,#f6e3a0,#a8741f 22%,#f0d27a 45%,#7a4f14 68%,#e8c66a 88%,#9a6a1f);
 --sheet:var(--paperimg),linear-gradient(#b0925f,#9c7e51)}
:root[data-theme=dark]{--sea:#172729;--sea2:#132123;--land:#a99a72}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--wood);color:var(--ink);font:16px/1.5 Spectral,Georgia,serif;overflow:hidden}
button{font:inherit;cursor:pointer}
.paper{background:var(--sheet);background-size:512px 512px,auto}
.gilt{position:relative;border:3px solid transparent;background-clip:padding-box;box-shadow:0 8px 22px #000a}
.gilt::before{content:"";position:absolute;inset:-3px;padding:3px;background:var(--gilt);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;border-radius:inherit}
.gilt::after{content:"";position:absolute;inset:3px;border:1px solid rgba(250,225,160,.35);pointer-events:none;border-radius:inherit}
.app{display:flex;flex-direction:column;height:100vh}
header{position:relative;z-index:6;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:start;gap:16px;padding:0 16px;height:72px;color:var(--ink);border-bottom:3px solid transparent;border-image:var(--gilt) 1;box-shadow:0 4px 14px #000a}
header .brand{display:flex;flex-direction:column;justify-content:center;height:68px}
header h1{font:400 25px/1 "IM Fell English SC",serif;margin:0;letter-spacing:.02em;color:#1a0e04;text-shadow:0 1px 0 rgba(255,235,180,.35)}
header .ver{font:italic 13px "IM Fell English",serif;color:var(--muted)}
.notches{display:flex;gap:6px;justify-content:center;height:84px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;padding:0 4px}
.notch{flex:none;width:54px;height:66px;margin-top:-3px;border-radius:0 0 12px 12px;display:flex;align-items:flex-end;justify-content:center;padding:0 0 7px;transition:transform .15s,height .15s;border:0}
.notch.gilt{border:3px solid transparent;border-top:0}
.notch.gilt::before{border-radius:0 0 13px 13px}
.notch svg{width:36px;height:36px;filter:drop-shadow(0 1px 0 rgba(255,235,180,.4))}
.notch:hover:not(:disabled){transform:translateY(3px)}
.notch.on{height:78px;background:var(--paperimg),linear-gradient(#c4a672,#a9895a);background-size:512px 512px,auto}
.notch.on::after{border-color:#8a1f1f;border-width:0 0 3px;inset:auto 8px 3px 8px}
.notch:disabled{cursor:default}
.notch:disabled .rivet{fill:#7a5c34;opacity:.5}
.notch:focus-visible{outline:2px solid #f2d98d;outline-offset:2px}
.stats{display:flex;gap:20px;align-items:center;height:68px}
.stat{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.stat b{font-weight:600;font-size:20px;color:#1a0e04;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat span{color:var(--muted);font:400 14px "IM Fell English",serif}
.stat small{font-size:12px;color:#2f4a1a;line-height:1;font-variant-numeric:tabular-nums}
.stat.bad b,.stat.bad small{color:#8a1f1f}
.dv{pointer-events:none}
.mapwrap{position:relative;flex:1;min-height:0;background:var(--sea);overflow:hidden}
#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab;transform-origin:0 0;will-change:transform}
#map.drag{cursor:grabbing}
.place{cursor:pointer}
.place text{font:600 10px Spectral,serif;fill:#2a1d12;paint-order:stroke;stroke:#efe2c4;stroke-width:3px;pointer-events:none}
.place:hover circle.seal{stroke:#fff;stroke-width:2.5}
.sealabel{font:italic 22px "IM Fell English",serif;fill:#b9cdc6;opacity:.45;pointer-events:none}
.cell{stroke:rgba(60,40,20,.35);stroke-width:.8;cursor:pointer;vector-effect:non-scaling-stroke}
.cell.sel{stroke:#fff;stroke-width:2}
.cell.tgt{stroke:#8a1f1f;stroke-width:1.6}
.toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(36,21,8,.92);color:#f0dcae;padding:8px 16px;border-radius:6px;font-size:15px;pointer-events:none;opacity:0;transition:opacity .25s;max-width:60%;text-align:center;z-index:4}
.toast.on{opacity:1}
.mapctl{position:absolute;right:12px;top:22px;display:flex;flex-direction:column;gap:8px;z-index:3}
.mapctl button{width:44px;height:44px;border-radius:6px;font-size:20px;color:var(--ink)}
.legend{position:absolute;left:12px;bottom:12px;border-radius:6px;padding:8px 10px;font-size:13px;max-width:220px;max-height:40%;overflow:auto;z-index:2}
.legend div{display:flex;align-items:center;gap:6px;line-height:1.35}
.legend i{width:11px;height:11px;border-radius:50%;display:inline-block;border:1px solid #0006;flex:none}
.card{position:absolute;right:68px;top:22px;width:290px;border-radius:8px;padding:12px 14px;display:none;z-index:3}
.card h3{margin:0 0 2px;font:400 22px "IM Fell English",serif}
.card .sub{color:var(--muted);font-size:14px;margin-bottom:8px}
.card .x,.page .x{position:absolute;right:6px;top:4px;border:0;background:none;font-size:24px;width:40px;height:40px;color:var(--muted);z-index:2}
.page{position:absolute;left:12px;top:22px;width:410px;max-height:calc(100% - 40px);border-radius:8px;display:none;flex-direction:column;z-index:4}
.page.open{display:flex;animation:drop .22s ease-out}
@keyframes drop{from{transform:translateY(-12px);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.page.open,#frame{animation:none!important}}
.panel{overflow-y:auto;padding:16px 18px 20px;flex:1}
.panel h2{font:400 28px/1.1 "IM Fell English SC",serif;margin:2px 40px 6px 0}
.panel h4{font:400 18px "IM Fell English",serif;margin:16px 0 6px;color:var(--accent)}
.row{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px dotted var(--line);font-size:15px}
.row span:last-child{font-variant-numeric:tabular-nums;text-align:right}
.btn{display:block;width:100%;text-align:left;margin:6px 0;padding:9px 12px;min-height:44px;border:1px solid #6b4a1e;border-radius:6px;background:linear-gradient(rgba(240,215,160,.35),rgba(120,85,40,.25));color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,240,200,.35)}
.btn small{display:block;color:var(--muted);font-size:13px}
.btn:hover:not(:disabled){background:linear-gradient(rgba(250,230,180,.55),rgba(140,100,50,.3))}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.red{border-color:var(--accent);color:var(--accent)}
.person{border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:6px 0;background:rgba(255,235,190,.12)}
.person b{font-weight:600}
.person .meta{font-size:13px;color:var(--muted)}
.log p{margin:0 0 6px;font-size:14px}.log p b{color:var(--accent);font-weight:600}
.plaque{position:absolute;right:12px;bottom:12px;display:flex;align-items:center;gap:14px;padding:10px 12px 10px 16px;border-radius:8px;z-index:3}
.plaque .note{display:block;font:400 14px "IM Fell English",serif;color:var(--muted)}
.ap{display:flex;gap:5px;flex-wrap:wrap;max-width:110px;margin-top:2px}
.ap.mar i{border-radius:2px;width:12px;height:12px;background:#4a5a2a}.ap i{width:16px;height:16px;border-radius:50%;background:var(--accent);border:1px solid #0006}.ap i.used{background:transparent!important}
.endyear{padding:10px 18px;min-height:44px;border-radius:6px;border:1px solid #3a0c0c;background:linear-gradient(#a3302a,#741818);color:#f6e7b8;font:400 18px "IM Fell English",serif;box-shadow:inset 0 1px 0 rgba(255,200,160,.35)}
.endyear:disabled{opacity:.5}
.modalbg{position:fixed;inset:0;background:radial-gradient(ellipse at center,#0007,#000e);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#frame{position:relative;width:min(560px,100%);max-height:92vh;display:flex;flex-direction:column;animation:unroll .35s ease-out;transform-origin:50% 0}
@keyframes unroll{from{transform:scaleY(.15);opacity:0}to{transform:none;opacity:1}}
.rod{display:block;height:24px;margin:0 -12px;border-radius:12px;flex:none;position:relative;z-index:2;background:linear-gradient(#efd48a,#a8741f 45%,#5a3a12 55%,#c99a3f);box-shadow:0 4px 8px #0008,inset 0 -2px 3px #0006}
.rod::before,.rod::after{content:"";position:absolute;top:-4px;width:18px;height:32px;border-radius:8px;background:linear-gradient(#f3d98f,#7a4f14);box-shadow:0 2px 4px #0006}
.rod::before{left:-9px}.rod::after{right:-9px}
.modal{flex:1;overflow:auto;margin:0 2px;padding:28px 34px 34px;color:var(--ink);border:1px solid #5a3f18;outline:1.5px solid #b8892d;outline-offset:-9px;background:var(--paperimg),radial-gradient(ellipse at 50% 0%,#c9ad7c,transparent 65%),linear-gradient(90deg,#937549,#b19366 10%,#b19366 90%,#937549);background-size:512px 512px,auto,auto}
.modal h2{font:400 31px/1.1 "IM Fell English SC",serif;margin:0;text-align:center;color:var(--ink);text-wrap:balance}
.modal h2::after{content:"\2766";display:block;font:20px/1 serif;color:#9a6a1f;margin:8px 0 14px}
.modal p{margin:0 0 10px}
.modal h2+p:not(.note)::first-letter{float:left;font:400 3.3em/.8 "IM Fell English SC",serif;color:#8a1f1f;padding:5px 8px 0 0}
.modal .btn{background:linear-gradient(90deg,transparent,#c9a45a33 20%,#c9a45a33 80%,transparent);border:0;border-top:1px solid #9a6a1f;border-bottom:1px solid #9a6a1f;border-radius:0;text-align:center;font:400 19px "IM Fell English",serif;color:var(--ink);margin:8px 0;box-shadow:none}
.modal .btn:hover:not(:disabled){background:linear-gradient(90deg,transparent,#c9a45a77 20%,#c9a45a77 80%,transparent)}
.modal .btn small{font:italic 14px Spectral,serif;color:#3a2410}
.modal .btn.red{color:#8a1f1f}
.seal{position:absolute;right:-4px;bottom:-14px;width:58px;height:58px;border-radius:50%;z-index:3;background:radial-gradient(circle at 35% 30%,#d24a3a,#8a1f1f 55%,#4a0f0f);box-shadow:0 5px 10px #000a,inset 0 0 0 4px #7a1818,inset 0 0 0 6px #b13a2c;display:flex;align-items:center;justify-content:center;font:400 26px "IM Fell English SC",serif;color:#e9b9a8;pointer-events:none}
.modal input,.modal select{font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--coast);border-radius:6px;background:#d6c194;width:100%;min-height:44px;color:var(--ink)}
.modal label{display:block;margin:10px 0 4px;font-size:15px;color:#3a2410}
.modal .note{color:#3a2410}
.realmgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;max-height:260px;overflow:auto;padding:2px}
.realmgrid button{color:var(--ink);font-family:"IM Fell English",serif;font-size:17px;padding:5px 8px;border:2px solid var(--line);border-radius:6px;background:rgba(255,235,190,.18);text-align:left;min-height:44px;line-height:1.15}
.realmgrid button.on{border-color:var(--accent);background:#d2bb8c}
.realmgrid i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.modal .realmgrid .note{color:#5a3d1e;font-family:Spectral,serif;font-size:12px}
.note{font-size:13px;color:var(--muted)}
#title{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px;background:radial-gradient(ellipse at 50% 35%,#4a3322,#1c120b 75%);color:#f0e0b8}
#title.hide{display:none}
#title svg.crown{width:min(220px,40vw);height:auto;filter:drop-shadow(0 6px 14px #000a)}
#title h1{font:400 clamp(40px,8vw,84px)/1 "IM Fell English SC",serif;margin:10px 0 4px;color:#f2d98d;text-shadow:0 3px 0 #000a;text-wrap:balance}
#title .tag{font:italic clamp(17px,2.4vw,24px) "IM Fell English",serif;color:#d9c293;margin:0 0 26px}
#title .menu{display:flex;flex-direction:column;gap:10px;width:min(320px,100%)}
#title .menu button{padding:12px 18px;min-height:48px;border:2px solid #b8892d;border-radius:6px;background:linear-gradient(#5b3a22,#3a2314);color:#f6e7b8;font:400 20px "IM Fell English",serif}
#title .menu button:hover:not(:disabled){background:linear-gradient(#7a4d2c,#4d2f1b)}
#title .menu button:disabled{opacity:.4;cursor:not-allowed}
#title .ver2{position:absolute;top:14px;left:18px;font:italic 14px "IM Fell English",serif;color:#a88f61}
#title .rule{width:min(360px,70vw);height:2px;background:linear-gradient(90deg,transparent,#b8892d,transparent);margin:6px 0 10px}
@media(max-width:1180px){
 header{grid-template-columns:auto auto;height:auto;row-gap:0}
 header .brand{height:52px}.stats{height:52px;justify-self:end}
 .notches{grid-column:1/-1;grid-row:2;justify-content:flex-start;height:72px}
}
@media(max-width:640px){
 .stats{gap:10px}.stat b{font-size:16px}.stat span{font-size:12px}
 header h1{font-size:20px}
 .page{left:8px;right:8px;width:auto}
 .card{left:8px;right:60px;width:auto}
 .legend{display:none}
 .plaque{left:8px;right:8px;justify-content:space-between}
 .toast{max-width:90%;bottom:90px}
}
</style>
</head>
<body>
<div class="app" id="app">
 <header class="paper">

 </header>

  <div class="card paper gilt" id="card"></div>

 </div>

  <circle cx="100" cy="106" r="9" fill="#8a1f1f" stroke="#5a3d0e" stroke-width="3"/><circle cx="64" cy="141" r="5" fill="#2f6a9a"/><circle cx="100" cy="141" r="5" fill="#8a1f1f"/><circle cx="136" cy="141" r="5" fill="#2f6a9a"/>
 </svg>
 <h1>Crown &amp; Dynasty</h1>
 <div class="rule"></div>
 <p class="tag">Rule a kingdom. Chart the world. Claim the land.</p>
 <div class="menu">

 </div>

</div>

<script>
{

   Crown & Dynasty — core build.
   Kept: map, tiles, fog & exploration, ships, seasons, gold, towns, war.

const FEMALE = ["Isolde","Matilda","Eleanor","Rosamund","Beatrix","Cecily","Margery","Adela","Sibyl","Gwendolyn","Elise","Clémence","Odette","Joan","Agnes","Blanche","Ingrid","Leonor","Mathilde","Aveline","Yolande","Hedwig","Ermengarde","Gisela","Urraca","Sigrid","Brígh","Ysabeau"];
const EPITHETS = ["the Bold","the Pious","the Fair","the Young","the Lame","the Wise","the Stern","the Generous","the Lion","the Unready","the Black","the Red","the Good","the Cruel","the Fat","the Learned","Ironhand","the Builder","the Quiet","Longshanks"];
const HOUSES = ["Varne","Mortaigne","Halloway","Corbeau","Ostrand","Dauvergne","Penhallow","Riesen","Blackmere","Montclair","Valdric","Hartwell","Lisieux","Strandberg","Croix-Haute","Aubrac","Rosenthal","Kervignac","Wendmoor","Saint-Clair","Falkenrode","Ormesby","Belcastel","Ruthven","Torvald","Grimaud"];
const SEA_RANGE = 430;
const DEEDS_PER_SEASON = 2;

let S = null;            // game state
let page = null;   // which notch page is open
let selected = null;
let vb = {x:0,y:0,w:1000,h:800};
const pr = () => S.realms[S.player];
const rulerTitle = () => S.monarch.gender==="m" ? "King" : "Queen";
function randomRuler(){ const gender = Math.random()<0.82 ? "m" : "f"; return {name:pick(gender==="m"?MALE:FEMALE), gender, epithet: Math.random()<0.55 ? pick(EPITHETS) : "", house: pick(HOUSES)}; }
const rulerOf = rid => rid===S.player ? `${rulerTitle()} ${S.monarch.name} of House ${S.dynasty}` : (()=>{ const r=S.realms[rid].ruler; return `${r.gender==="m"?"King":"Queen"} ${r.name}${r.epithet?" "+r.epithet:""} of House ${r.house}`; })();

/* ---------- setup ---------- */
function newGame(realmId, name, gender, dyn){
 S = {version:VERSION, year:1500, season:0, player:realmId, gold:300, food:60, res:60, devs:{}, starving:0, ap:DEEDS_PER_SEASON, marches:0,
  dynasty:dyn, monarch:{name, gender}, explored:{}, seen:[], expeditions:[], log:[], over:false, nextId:1, places:[], realms:{}, events:[]};
 S.places = PLACES_RAW.map(p => ({id:p.id,name:p.name,x:p.x,y:p.y,owner:p.realm,dev:p.dev,fort:1,port:!!p.port,capital:!!p.capital}));
 S.tiles = CELLS.map(c => c[4] && c[1]>=0 ? PLACES_RAW[c[1]].realm : null);
 S.seen = CELLS.map(()=>0);
 for(const [id,r] of Object.entries(REALMS)){
  const n = S.places.filter(p=>p.owner===id).length;
  S.realms[id] = {id, name:r.name, color:r.color, gold:80*n, alive:true, atWar:[], truce:{}, warStart:{}, lost:{}, ruler: id===realmId ? null : randomRuler()};
 }
 S.marches = maxMarches(); updateSight();
 log(`${rulerTitle()} ${name} of House ${dyn} is crowned sovereign of ${pr().name}.`);
 save(); render(); goHome(false);
}

/* ---------- geometry & power ---------- */
const owned = rid => S.places.filter(p=>p.owner===rid);
const dist = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
const placeIdx = p => S.places.indexOf(p);
const tileOfTown = p => TOWNCELL[placeIdx(p)];
const TOWNAT = new Map(TOWNCELL.map((c,k)=>[c,k]));
const tileCount = rid => S.tiles.reduce((n,t)=>n+(t===rid),0);
const tileAdj = (rid,i) => NEI[i].some(j=>S.tiles[j]===rid);
function reachable(rid, place){
 if(place.owner===rid) return false;
 if(tileAdj(rid, tileOfTown(place))) return true;
 if(place.port && owned(rid).some(m => m.port && dist(m,place) <= SEA_RANGE)) return true;
 return false;
}
function neighbours(rid){
 const set=new Set();
 for(let i=0;i<S.tiles.length;i++) if(S.tiles[i]===rid) for(const j of NEI[i]){ const o=S.tiles[j]; if(o && o!==rid) set.add(o); }
 for(const o of Object.keys(S.realms)) if(o!==rid && S.realms[o].alive && !set.has(o) && owned(o).some(p=>reachable(rid,p))) set.add(o);
 return [...set].filter(o=>S.realms[o].alive);
}
// HOOK: placeholder military strength, derived from land held (no army system yet).
const strength = rid => 1000 + 400*owned(rid).length + 6*tileCount(rid);
// HOOK: marches per season are flat until an army system exists.
const maxMarches = () => S.season===3 ? 2 : 3;
/* ---------- economy (per season) ----------
   Gold: +3 for every tile held, plus gold mines.  Food: farms and fishing grow it; towns (by development) and villages eat it.
   Resources: towns and villages produce them; every building costs gold and resources. */
const GOLD_PER_TILE = 3;
const MINE = [null, {lvl:"I",gold:25,g:180,r:70}, {lvl:"II",gold:15,g:120,r:45}, {lvl:"III",gold:10,g:80,r:30}, {lvl:"IV",gold:5,g:60,r:20}];   // index = mine level; IV is the first built, I the richest
const DEV = {
 farm:   {name:"Farm",      food:6, g:40, r:10, blurb:"+6 food a season"},
 fish:   {name:"Fishery",   food:5, g:30, r:8,  blurb:"+5 food a season · coastal tiles only", coastal:true},
 village:{name:"Village",   res:4,  eat:2, g:50, r:15, blurb:"+4 resources a season · its people eat 2 food"},
 mine:   {name:"Gold mine", g:MINE[4].g, r:MINE[4].r, blurb:`+${MINE[4].gold} gold a season at level IV, up to +${MINE[1].gold} at level I`}
};
const isCoastal = i => CELLS[i][5]===1;
function economy(rid){
 const tiles = tileCount(rid), towns = owned(rid);
 const E = {tiles, goldTiles: GOLD_PER_TILE*tiles, goldMines:0, food:0, eat: towns.reduce((s,p)=>s+p.dev,0), res: 2*towns.length, mines:0, farms:0, fish:0, villages:0};
 if(rid===S.player) for(const k in S.devs){ const i=+k, d=S.devs[k]; if(S.tiles[i]!==rid) continue;
  if(d.t==="mine"){ E.goldMines += MINE[d.lvl].gold; E.mines++; }
  else if(d.t==="farm"){ E.food += DEV.farm.food; E.farms++; }
  else if(d.t==="fish"){ E.food += DEV.fish.food; E.fish++; }
  else if(d.t==="village"){ E.res += DEV.village.res; E.eat += DEV.village.eat; E.villages++; } }
 E.gold = E.goldTiles + E.goldMines; E.netFood = E.food - E.eat;
 return E;
}
const income = rid => economy(rid).gold;   // per season
const atWar = (a,b) => S.realms[a].atWar.includes(b);
function setWar(a,b){
 if(a===S.player) reveal(b); else if(b===S.player) reveal(a);
 if(atWar(a,b)) return;
 S.realms[a].atWar.push(b); S.realms[b].atWar.push(a);
 S.realms[a].warStart[b] = S.realms[b].warStart[a] = S.year;
 S.realms[a].lost[b] = S.realms[b].lost[a] = 0;
}
function setPeace(a,b){
 S.realms[a].atWar = S.realms[a].atWar.filter(x=>x!==b);
 S.realms[b].atWar = S.realms[b].atWar.filter(x=>x!==a);
 S.realms[a].truce[b] = S.realms[b].truce[a] = S.year + 5;
}
const truce = (a,b) => (S.realms[a].truce[b]||0) > S.year;
const defenseOf = place => place.fort*500 + place.dev*150 + strength(place.owner)*0.3 + (place.capital?500:0);
function battle(att, place){
 const def = place.owner;
 const win = strength(att)*0.5*R(0.75,1.25) > defenseOf(place)*R(0.8,1.2);
 if(win){
  place.owner = att; place.fort = Math.max(1, place.fort-1); const wasCap = place.capital; place.capital = false;
  const k = placeIdx(place); S.tiles[TOWNCELL[k]] = att; CELLS.forEach((c,i)=>{ if(c[1]===k && S.tiles[i]===def) S.tiles[i]=att; });
  S.realms[def].lost[att] = (S.realms[def].lost[att]||0) + 1;
  if(wasCap){ const rest = owned(def); if(rest.length) rest.sort((a,b)=>b.dev-a.dev)[0].capital = true; }
  if(!owned(def).length) destroyRealm(def, att);
 }
 return {win, place:place.name};
}
function tileSkirmish(att, def){
 if(!def) return true;
 const a=strength(att), d=strength(def);
 return Math.random() < clamp(0.55 + (a - d*0.6)/(a+d)*0.8, 0.15, 0.92);
}
function destroyRealm(rid, by){
 const r = S.realms[rid]; r.alive = false;
 for(let i=0;i<S.tiles.length;i++) if(S.tiles[i]===rid) S.tiles[i]=by;
 for(const o of r.atWar) S.realms[o].atWar = S.realms[o].atWar.filter(x=>x!==rid);
 r.atWar=[];
 log(`The realm of ${r.name} has fallen to ${S.realms[by].name}.`, true);
 if(rid===S.player) gameOver(`${r.name} has been conquered. The crown of House ${S.dynasty} lies in the mud.`);
}

/* ---------- logging & save ---------- */
function log(t, big){ for(const r of Object.values(S.realms)){ if(r.id!==S.player && !S.explored[r.id]) t = t.split(r.name).join("a distant realm"); }
 S.log.unshift({y:S.year, s:S.season, t, big:!!big}); if(S.log.length>300) S.log.length=300; }
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }
function load(){ try{ let s = localStorage.getItem(SAVE_KEY); for(const k of OLD_SAVE_KEYS) if(!s) s = localStorage.getItem(k); if(!s) return null; const o = JSON.parse(s); if(!o.tiles || o.tiles.length!==CELLS.length) return null; if(o.food==null){ o.food=60; o.res=60; o.devs={}; o.starving=0; } return o; }catch(e){ return null; } }

/* ---------- modals ---------- */
const mq = [];
function modal(m){ mq.push(m); if(mq.length===1) showModal(); }
function showModal(){
 while(mq.length && typeof mq[0]==="function"){ let r=null; try{ r=mq[0](); }catch(e){ console.warn(e); } if(r) mq[0]=r; else mq.shift(); }
 const m = mq[0]; if(!m){ $("modalbg").style.display="none"; return; }
 $("modal").innerHTML = `<h2>${m.title}</h2>${m.body||""}<div id="mch"></div>`;
 const ch = $("mch");
 (m.choices||[{label:"Continue"}]).forEach(c=>{
  const b = document.createElement("button"); b.className="btn"+(c.red?" red":"");
  b.innerHTML = c.label + (c.sub?`<small>${c.sub}</small>`:""); b.disabled = !!c.disabled;
  b.onclick = () => { if(c.keep && c.fn){ c.fn(); return; } mq.shift(); if(c.fn){ try{ c.fn(); }catch(e){ console.warn(e); } } render(); showModal(); };
  ch.appendChild(b);
 });
 $("modalbg").style.display="flex";
 if(m.onshow) m.onshow();
}
function toast(t){ const el=$("toast"); el.textContent=t; el.classList.add("on"); clearTimeout(toast.h); toast.h=setTimeout(()=>el.classList.remove("on"),2600); }

/* ---------- seasons, fog of war & exploration ---------- */
const SEASONS = ["Spring","Summer","Autumn","Winter"];
const turn = () => S.year*4 + S.season;
const when = (t=turn()) => `${SEASONS[((t%4)+4)%4]} ${Math.floor(t/4)}`;
let CELLC=null, FOGT=null, COMP=null;
const known = rid => rid===S.player || !!(S.explored && S.explored[rid]);
function reveal(rid){ if(!S.explored || known(rid)) return; S.explored[rid]=true; log(`We have made contact with ${S.realms[rid].name}, ruled by ${rulerOf(rid)}.`, true); }
function cellInit(){ if(CELLC) return;
 CELLC = CELLS.map(c=>{ let x=0,y=0,n=0; for(const m of c[0].matchAll(/(-?[\d.]+) (-?[\d.]+)/g)){ x+=+m[1]; y+=+m[2]; n++; } return [x/n,y/n]; });
 FOGT = CELLC.map(([x,y])=>{ let b=0,bd=1e9; PLACES_RAW.forEach((p,k)=>{ const d=Math.hypot(p.x-x,p.y-y); if(d<bd){bd=d;b=k;} }); return b; });
 COMP = CELLS.map(()=>-1); let c=0;
 for(let i=0;i<CELLS.length;i++){ if(COMP[i]>=0) continue; const q=[i]; COMP[i]=c; while(q.length){ const k=q.pop(); for(const j of NEI[k]) if(COMP[j]<0){ COMP[j]=c; q.push(j); } } c++; } }
const cellRealm = i => S.tiles[i] || S.places[FOGT[i]].owner;
const fogged = i => !S.seen[i];
function updateSight(){
 cellInit();
 for(let i=0;i<S.tiles.length;i++) if(S.tiles[i]===S.player){ S.seen[i]=1; for(const j of NEI[i]) S.seen[j]=1; }
 for(let i=0;i<S.tiles.length;i++){ const o=S.tiles[i]; if(S.seen[i] && o && !known(o)) reveal(o); }
}
function landReach(i){ cellInit(); const c=COMP[i]; return S.tiles.some((o,j)=>o===S.player && COMP[j]===c); }
const shipsReady = p => p.ships!=null && turn()>=p.ships;
const portBusy = p => S.expeditions.some(e=>e.port===p.id);
const shipPorts = () => owned(S.player).filter(p=>p.port && shipsReady(p) && !portBusy(p));
function planExplore(i){
 cellInit();
 if(S.expeditions.some(e=>e.tile===i)) return {ok:false, why:"Explorers are already bound for these lands."};
 if(landReach(i)) return {ok:true, sea:false, seasons:1, cost:60};
 const mine = owned(S.player).filter(p=>p.port);
 if(!mine.length) return {ok:false, why:"These lands lie over the sea, and we hold no port town."};
 if(!mine.some(p=>p.ships!=null)) return {ok:false, why:"These lands lie over the sea. Build ships in one of our port towns first."};
 const ports = shipPorts();
 if(!ports.length) return {ok:false, why: mine.some(p=>p.ships!=null && !shipsReady(p)) ? "Our ships are still being built." : "All our ships are already at sea."};
 const [x,y]=CELLC[i]; const port = ports.sort((a,b)=>Math.hypot(a.x-x,a.y-y)-Math.hypot(b.x-x,b.y-y))[0];
 const d = Math.hypot(port.x-x, port.y-y);
 return {ok:true, sea:true, port, seasons: d<220?2:d<450?3:4, cost:120};
}
function nearestFrontier(){
 cellInit(); let best=-1, bd=1e9;
 const cap = owned(S.player).find(p=>p.capital) || owned(S.player)[0]; if(!cap) return -1;
 for(let i=0;i<S.tiles.length;i++){ if(S.seen[i] || !landReach(i) || S.expeditions.some(e=>e.tile===i)) continue;
  if(!NEI[i].some(j=>S.seen[j])) continue; const d=Math.hypot(CELLC[i][0]-cap.x, CELLC[i][1]-cap.y); if(d<bd){bd=d;best=i;} }
 return best;
}
function actExplore(i){
 if(i==null || i<0) i = nearestFrontier(); if(i<0) return;
 const pl = planExplore(i); if(!pl.ok || S.gold<pl.cost || !useAP()) return;
 S.gold -= pl.cost;
 S.expeditions.push({id:S.nextId++, tile:i, start:turn(), eta:turn()+pl.seasons, sea:pl.sea, port:pl.sea?pl.port.id:null, portName:pl.sea?pl.port.name:null});
 log(pl.sea ? `An exploring fleet sails from ${pl.port.name}. They expect to return by ${when(turn()+pl.seasons)}.` : `Scouts ride out into the uncharted country. They will report at season's end.`);
 if(selected && String(selected).startsWith("fog:")) selected=null; after();
}
function revealBlob(start){
 const g = cellRealm(start); let hidden=0;
 for(let i=0;i<S.tiles.length;i++) if(!S.seen[i] && cellRealm(i)===g) hidden++;
 const target = Math.max(6, Math.round(hidden*0.2));
 const q=[start], vis=new Set([start]); let got=0;
 while(q.length && got<target){ const i=q.shift(); if(!S.seen[i]){ S.seen[i]=1; got++; }
  for(const j of NEI[i]) if(!vis.has(j) && !S.seen[j] && cellRealm(j)===g){ vis.add(j); q.push(j); } }
 updateSight(); return got;
}
function expStatus(e){
 const t=turn(), tot=e.eta-e.start, el=t-e.start;
 if(!e.sea) return "scouting the land";
 return el < tot/3 ? "sailing out" : el < tot*2/3 ? "mapping the coasts" : "sailing home";
}
function resolveExpeditions(summary){
 for(const e of [...S.expeditions]){
  if(turn() < e.eta) continue;
  S.expeditions = S.expeditions.filter(x=>x!==e);
  if(Math.random() < (e.sea?0.15:0.08)){ summary.push(e.sea?`<b>The fleet from ${e.portName} never returned.</b> Storms or worse.`:`Our scouts vanished in the wilds. Nothing is learned.`); log(e.sea?`The exploring fleet from ${e.portName} is lost.`:`A scouting party is lost.`); continue; }
  const n = revealBlob(e.tile), o = cellRealm(e.tile);
  const who = o ? `the lands of <b>${S.realms[o].name}</b>` : "unclaimed wilds";
  summary.push(`<b>${e.sea?"Our fleet returns to "+e.portName:"Our scouts return"}</b> having charted ${n} tiles of ${who}.`);
  log(`Explorers chart ${n} tiles of ${o?S.realms[o].name:"wild country"}.`);
 }
}
function actBuildShips(p){ if(!p.port || p.owner!==S.player || p.ships!=null || S.gold<150 || !useAP()) return; S.gold-=150; p.ships = turn()+1; log(`Shipwrights in ${p.name} lay down the keels of a new fleet. Ready by ${when(turn()+1)}.`); after(); }

/* ---------- player actions ---------- */
function useAP(){ if(S.ap<1) return false; S.ap--; return true; }
function canAct(){ return S.ap>0 && !S.over; }
function after(){ save(); render(); }
function actImprove(p){ const c=100*p.dev; if(p.dev>=6||S.gold<c||!useAP()) return; S.gold-=c; p.dev++; log(`${p.name} prospers: new markets and guildhalls (development ${p.dev}).`); after(); }
function actFortify(p){ const c=90*p.fort; if(p.fort>=4||S.gold<c||!useAP()) return; S.gold-=c; p.fort++; log(`The walls of ${p.name} are raised higher (fortification ${p.fort}).`); after(); }
function actAttack(p){
 if(!atWar(S.player,p.owner)||!reachable(S.player,p)||!useAP()) return;
 const foe = S.realms[p.owner].name, res = battle(S.player,p);
 log(res.win?`Victory! ${p.name} taken from ${foe}.`:`Our assault on ${p.name} was repulsed.`, true);
 modal({title: res.win?`${p.name} is ours!`:`Repulsed at ${p.name}`, body:`<p>${res.win?"Our banners fly over the walls, and the countryside around it is ours.":"The defenders held the walls."}</p>`});
 if(res.win) selected = p.id; after();
}
function actDeclare(rid){
 if(truce(S.player,rid)||atWar(S.player,rid)||!useAP()) return;
 setWar(S.player,rid); log(`War is declared upon ${S.realms[rid].name}!`, true); after();
}
function peaceChance(rid){
 const e=S.realms[rid], me=pr();
 return clamp(Math.round(30 + (e.lost[S.player]||0)*15 - (me.lost[rid]||0)*12 + (strength(S.player)>strength(rid)?15:-10) + (S.year-(e.warStart[S.player]||S.year))*5), 5, 95);
}
function actPeace(rid){
 if(!useAP()) return;
 if(Math.random()*100<peaceChance(rid)){ setPeace(S.player,rid); log(`Peace is signed with ${S.realms[rid].name}. A truce of five years begins.`, true); }
 else log(`${S.realms[rid].name} rejects our envoys. The war goes on.`);
 after();
}
function canPay(g,r){ return S.gold>=g && S.res>=r; }
function actBuild(i,t){
 const d=DEV[t]; if(S.over || S.tiles[i]!==S.player || TOWNAT.has(i) || S.devs[i] || (d.coastal && !isCoastal(i)) || !canPay(d.g,d.r)) return;
 S.gold-=d.g; S.res-=d.r; S.devs[i] = t==="mine" ? {t, lvl:4} : {t};
 toast(t==="mine" ? `A level IV gold mine opens: +${MINE[4].gold} gold a season.` : `A new ${d.name.toLowerCase()} is built.`); after();
}
function actUpgradeMine(i){
 const d=S.devs[i]; if(!d || d.t!=="mine" || d.lvl<=1 || S.tiles[i]!==S.player) return; const nx=MINE[d.lvl-1];
 if(!canPay(nx.g,nx.r)) return; S.gold-=nx.g; S.res-=nx.r; d.lvl--; toast(`The mine is dug deeper: level ${nx.lvl}, +${nx.gold} gold a season.`); after();
}
function actRaze(i){ if(S.tiles[i]!==S.player || !S.devs[i]) return; delete S.devs[i]; toast("The works are torn down."); after(); }
function actOccupy(i){
 const o=S.tiles[i];
 if(!o || !atWar(S.player,o) || TOWNAT.has(i) || !tileAdj(S.player,i) || S.marches<1) return;
 S.marches--;
 if(tileSkirmish(S.player,o)){ S.tiles[i]=S.player; toast(`Our soldiers take the land from ${S.realms[o].name}.`); }
 else toast(`Our march was driven back by ${S.realms[o].name}.`);
 after();
}
function actClaim(i){
 if(S.tiles[i] || !tileAdj(S.player,i) || S.marches<1 || S.gold<10) return;
 S.marches--; S.gold-=10; S.tiles[i]=S.player; toast("Settlers raise the royal banner over new land."); after();
}
function gameOver(text){
 S.over = true; save();
 modal({title:"The End of a Reign", body:`<p>${text}</p>`, choices:[{label:"Return to the title screen", fn:()=>{ $("title").classList.remove("hide"); const sv=load(); $("tcont").disabled=!(sv&&!sv.over); }}]});
}

/* ---------- end of season ---------- */
function endSeason(){
 if(S.over) return;
 const summary = [], me = pr(), winter = S.season===3;
 const E = economy(S.player), starvedLast = S.starving>0;
 const inc = starvedLast ? Math.round(E.gold/2) : E.gold;
 S.gold += inc; S.res += E.res; S.food += E.netFood;
 if(S.food < 0){
  S.food = 0; S.starving++;
  const vil = Object.keys(S.devs).filter(k=>S.devs[k].t==="village" && S.tiles[+k]===S.player);
  if(vil.length){ const k=pick(vil); delete S.devs[k]; summary.push(`<b>Famine!</b> The granaries are empty. Starving families abandon a village.`); log("Famine: a village is abandoned.", true); }
  else { const edge=S.tiles.map((o,i)=>i).filter(i=>S.tiles[i]===S.player && !TOWNAT.has(i) && NEI[i].some(j=>S.tiles[j]!==S.player));
   if(edge.length){ const i=pick(edge); S.tiles[i]=null; delete S.devs[i]; summary.push(`<b>Famine!</b> The granaries are empty. Starving people flee, and a borderland falls wild.`); log("Famine: hungry people abandon the borderlands.", true); }
   else summary.push(`<b>Famine!</b> The granaries are empty and the people go hungry.`); }
  summary.push("Taxes will bring in only half while the people starve. Build farms or fisheries.");
 } else S.starving = 0;
 // AI realms
 for(const r of Object.values(S.realms)){
  if(!r.alive || r.id===S.player) continue;
  r.gold += income(r.id);
  for(const e of [...r.atWar]){
   if(!S.realms[e]?.alive || !r.alive) continue;

     else h += `<p class="note">The richest vein: level I.</p>`; }

 const p=S.places.find(x=>x.id===selected);

   if(p.ships==null) h += btn("Build ships", "150 gold · ready next season · needed to explore overseas", ()=>actBuildShips(p), !ap||S.gold<150); }
  h += btn("Fortify walls", p.fort>=4?"Walls at their height":`${90*p.fort} gold · harder to take`, ()=>actFortify(p), !ap||p.fort>=4||S.gold<90*p.fort);

/* ---------- map ---------- */
function noiseURL(size, cells, octaves, rgb, aMin, aMax, seed){
 let sd=seed; const rnd=()=>{ sd=(sd*16807)%2147483647; return sd/2147483647; };
 const cv=document.createElement("canvas"); cv.width=cv.height=size; const cx=cv.getContext("2d"); const img=cx.createImageData(size,size);
 const layers=[]; for(let o=0;o<octaves;o++){ const n=cells*(1<<o); const g=Array.from({length:n*n},rnd); layers.push([n,g]); }
 const sm=t=>t*t*(3-2*t);
 for(let y=0;y<size;y++) for(let x=0;x<size;x++){
  let v=0, amp=1, tot=0;
  for(const [n,g] of layers){ const fx=x/size*n, fy=y/size*n, x0=Math.floor(fx), y0=Math.floor(fy), tx=sm(fx-x0), ty=sm(fy-y0);
   const G=(i,j)=>g[((j+n)%n)*n+((i+n)%n)];
   const a=G(x0,y0)+(G(x0+1,y0)-G(x0,y0))*tx, b=G(x0,y0+1)+(G(x0+1,y0+1)-G(x0,y0+1))*tx;
   v+=(a+(b-a)*ty)*amp; tot+=amp; amp*=0.5; }
  v/=tot; const k=(y*size+x)*4; img.data[k]=rgb[0]; img.data[k+1]=rgb[1]; img.data[k+2]=rgb[2]; img.data[k+3]=Math.round(255*(aMin+(aMax-aMin)*clamp((v-0.25)/0.5,0,1)));
 }
 cx.putImageData(img,0,0); return cv.toDataURL();
}
let CELLEL=[];
function buildMap(){
 const seaN = noiseURL(256, 4, 3, [2,10,14], 0, .7, 7), paperN = noiseURL(256, 6, 4, [60,38,15], 0, .32, 3), fogN = noiseURL(256, 5, 4, [214,210,196], 0, .8, 9);
 const svg=$("map");
 const cells = CELLS.map((c,i)=>`<path class="cell" data-i="${i}" data-t="${c[1]}" d="${c[0]}"/>`).join("");
 svg.innerHTML = `<defs>

  <pattern id="fogpat" patternUnits="userSpaceOnUse" width="260" height="260"><rect width="260" height="260" fill="#6f6b5d"/><image href="${fogN}" width="260" height="260" preserveAspectRatio="none"/></pattern>

 </defs>
 <rect x="-300" y="-300" width="1600" height="1400" style="fill:var(--sea)"/>

 <path d="${GRAT_PATH}" fill="none" stroke="#d6e6dd" stroke-opacity=".12" stroke-width=".8" stroke-dasharray="2 4"/>

 </g>

 <g transform="translate(78,92)" opacity=".75"><circle r="34" fill="none" stroke="#d6e6dd"/><path d="M0,-40 L6,0 0,40 -6,0Z" fill="#d6e6dd"/><path d="M-40,0 L0,6 40,0 0,-6Z" fill="#d6e6dd" opacity=".6"/><text y="-45" text-anchor="middle" font-family="IM Fell English" font-size="14" fill="#d6e6dd">N</text></g>
 <g id="devs"></g>

 CELLEL=[]; LODK=-1;
}
function renderCells(){
 if(!CELLEL.length) CELLEL=[...document.querySelectorAll("#map .cell")];

let anim=null;
const PS = () => Math.min(1, Math.pow(vb.w/1000, .85)).toFixed(3);
let LODK=-1, vbPending=false;
function setLOD(){ const k = vb.w>620?0 : vb.w>260?1 : 2; if(k===LODK) return; LODK=k; const d=[LAND_LO,LAND_MID,LAND_PATH][k]; for(const id of ["lfill","lpaper","lcoast"]){ const el=$(id); if(el) el.setAttribute("d",d); } }
let vbC=null, commitT=0;
function fitOf(b, cw, ch){ const s=Math.min(cw/b.w, ch/b.h); return {s, ox:(cw-b.w*s)/2, oy:(ch-b.h*s)/2}; }
function applyLive(){
 const svg=$("map"); if(!vbC) return setVB();
 const cw=svg.clientWidth, ch=svg.clientHeight; if(!cw||!ch) return setVB();
 const a=fitOf(vbC,cw,ch), b=fitOf(vb,cw,ch), k=b.s/a.s;
 const tx=b.ox - k*a.ox + (vbC.x-vb.x)*b.s, ty=b.oy - k*a.oy + (vbC.y-vb.y)*b.s;
 svg.style.transform=`translate(${tx}px,${ty}px) scale(${k})`;
}
function setVBsoon(delay=170){ applyLive(); clearTimeout(commitT); if(delay>=0) commitT=setTimeout(setVB, delay); }
function setVB(){ clearTimeout(commitT); setLOD(); vbC={...vb}; $("map").style.transform=""; $("map").setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`); const k=PS(); for(const g of document.querySelectorAll("#places .place, #devs .dv")) g.setAttribute("transform",`translate(${g.dataset.x},${g.dataset.y}) scale(${k})`); }
function aspect(){ const r=$("map").getBoundingClientRect(); return (r.width>10&&r.height>10)? r.width/r.height : 1.25; }
const maxW = () => Math.max(1000, 800*aspect());
function clampBox(b){ if(b.w>=1300) b.x=(1000-b.w)/2; else b.x=clamp(b.x,-150,1150-b.w); if(b.h>=1000) b.y=(800-b.h)/2; else b.y=clamp(b.y,-100,900-b.h); return b; }
function clampVB(){ clampBox(vb); }
function zoom(f, cx, cy){
 const A=aspect(), nw = clamp(vb.w*f, 90, maxW()), nh = nw/A;
 cx = cx ?? vb.x+vb.w/2; cy = cy ?? vb.y+vb.h/2;
 vb.x = cx - (cx-vb.x)*(nw/vb.w); vb.y = cy - (cy-vb.y)*(nh/vb.h); vb.w=nw; vb.h=nh; clampVB(); setVBsoon();
}
function fitAspect(){ const A=aspect(), cx=vb.x+vb.w/2, cy=vb.y+vb.h/2; vb.w=clamp(vb.w,90,maxW()); vb.h=vb.w/A; vb.x=cx-vb.w/2; vb.y=cy-vb.h/2; clampVB(); setVB(); }
function homeTarget(){
 const ps = S ? owned(S.player) : []; const A=aspect();
 if(!ps.length){ const w=maxW(); return clampBox({x:500-w/2,y:400-w/A/2,w,h:w/A}); }
 const xs=ps.map(p=>p.x), ys=ps.map(p=>p.y), x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys);
 let w = Math.max(x1-x0+200, (y1-y0+160)*A); w = clamp(w,260,maxW()); const h=w/A;
 return clampBox({x:(x0+x1)/2-w/2, y:(y0+y1)/2-h/2, w, h});
}
function animateTo(t, ms=850){
 cancelAnimationFrame(anim);
 if(matchMedia("(prefers-reduced-motion: reduce)").matches || ms<=0){ vb={...t}; setVB(); return; }
 const f={...vb}, t0=performance.now(), ease=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
 const step=now=>{ const u=Math.min(1,(now-t0)/ms), e=ease(u), A=aspect();
  const lw=Math.exp(Math.log(f.w)+(Math.log(t.w)-Math.log(f.w))*e);
  const cx=(f.x+f.w/2)+((t.x+t.w/2)-(f.x+f.w/2))*e, cy=(f.y+f.h/2)+((t.y+t.h/2)-(f.y+f.h/2))*e;
  vb.w=lw; vb.h=lw/A; vb.x=cx-vb.w/2; vb.y=cy-vb.h/2; clampVB();
  if(u<1){ setVBsoon(-1); anim=requestAnimationFrame(step); } else setVB(); };
 anim=requestAnimationFrame(step);
}
function goHome(animated=true){ animateTo(homeTarget(), animated?850:0); }
function svgPoint(e){ const svg=$("map"), pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY; return pt.matrixTransform(svg.getScreenCTM().inverse()); }
function bindMap(){
 const svg=$("map"); let drag=null, moved=0;
 svg.addEventListener("wheel", e=>{ e.preventDefault(); cancelAnimationFrame(anim); const p=svgPoint(e); zoom(e.deltaY>0?1.15:0.87, p.x, p.y); }, {passive:false});
 svg.addEventListener("pointerdown", e=>{ cancelAnimationFrame(anim); drag={x:e.clientX,y:e.clientY,vx:vb.x,vy:vb.y}; moved=0; });
 window.addEventListener("pointermove", e=>{ if(!drag) return; const s=Math.max(vb.w/svg.clientWidth, vb.h/svg.clientHeight);
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y; moved=Math.max(moved,Math.abs(dx)+Math.abs(dy)); if(moved>4){ svg.classList.add("drag"); vb.x=drag.vx-dx*s; vb.y=drag.vy-dy*s; clampVB(); setVBsoon(-1); } });
 window.addEventListener("pointerup", e=>{ if(drag && moved>4) setVB(); if(drag && moved<=4){ const g=e.target.closest&&e.target.closest(".place"); const cl=e.target.closest&&e.target.closest(".cell"); if(g){ selected=g.dataset.id; render(); } else if(cl){ const ci=+cl.dataset.i; if(fogged(ci)) selected="fog:"+ci; else if(TOWNAT.has(ci)) selected=S.places[TOWNAT.get(ci)].id; else selected="tile:"+ci; render(); } } drag=null; svg.classList.remove("drag"); });
 $("zin").onclick=()=>zoom(0.75); $("zout").onclick=()=>zoom(1.33); $("zreset").onclick=()=>goHome(true);
 new ResizeObserver(()=>fitAspect()).observe($("map").parentElement); fitAspect();
}

/* ---------- start screen ---------- */
function startScreen(){
 mq.length=0; let choice="albion", gender="m";
 const saved = load();
 const grid = Object.entries(REALMS).map(([k,r])=>{ const n=PLACES_RAW.filter(p=>p.realm===k).length; return `<button data-r="${k}" class="${k===choice?"on":""}"><i style="background:${r.color}"></i>${r.name}<br><span class="note">${n} town${n>1?"s":""}</span></button>`; }).join("");
 modal({title:"Crown &amp; Dynasty", body:`<p class="note">${VERSION} · Europe, anno Domini 1500</p>

(function paperTexture(){
 const N=512, cv=document.createElement("canvas"); cv.width=cv.height=N; const cx=cv.getContext("2d");
 const blot=new Image(), fine=new Image(); let n=0;
 const done=()=>{ if(++n<2) return;
  cx.drawImage(blot,0,0,N,N); cx.drawImage(fine,0,0,N,N);
  let sd=42; const rnd=()=>{ sd=(sd*16807)%2147483647; return sd/2147483647; };
  for(let i=0;i<900;i++){ const x=rnd()*N, y=rnd()*N, a=rnd()*Math.PI, l=4+rnd()*14; cx.strokeStyle=`rgba(${rnd()<.5?"60,38,15":"240,220,175"},${.05+rnd()*.08})`; cx.lineWidth=.6; cx.beginPath(); cx.moveTo(x,y); cx.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l); cx.stroke(); }
  for(let i=0;i<500;i++){ cx.fillStyle=`rgba(50,30,10,${.06+rnd()*.12})`; cx.beginPath(); cx.arc(rnd()*N,rnd()*N,rnd()*1.2+.2,0,7); cx.fill(); }
  document.documentElement.style.setProperty("--paperimg", `url(${cv.toDataURL()})`); };
 blot.onload=done; fine.onload=done;
 blot.src = noiseURL(256, 3, 4, [70,44,18], 0, .42, 21);
 fine.src = noiseURL(256, 24, 2, [245,228,190], 0, .22, 5);
})();

{ const sv = load(); $("tcont").disabled = !(sv && !sv.over); }
