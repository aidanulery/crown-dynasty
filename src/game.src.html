<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crown &amp; Dynasty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Spectral:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE: a royal chronicle — grave, warm, candlelit.
   IDEA: a campaign table: an engraved sea chart under a gilded, paper-bound ledger with brass-framed tabs.
   PICTURE: the map fills the window; twelve gilded notches hang from the top edge.
   COLOUR and TYPE: aged, darkened paper with gilt edges, slate sea, oxblood accent; IM Fell for titles, Spectral for text.
   LAYOUT: top bar (brand · notches · stats), map beneath; pages open as paper sheets over the map. */
:root{color-scheme:light dark;
 --wood:#2b1d14;--paper:#a98b5e;--paper2:#987a4f;--ink:#1f1206;--muted:#3e2814;
 --sea:#1f3437;--sea2:#1a2c2f;--land:#c2ae82;--coast:#5b4128;--accent:#8a1f1f;--gold:#b8892d;--line:#7a5c34;
 --paperimg:none;
 --gilt:linear-gradient(135deg,#f6e3a0,#a8741f 22%,#f0d27a 45%,#7a4f14 68%,#e8c66a 88%,#9a6a1f);
 --sheet:var(--paperimg),linear-gradient(#b0925f,#9c7e51)}
:root[data-theme=dark]{--sea:#172729;--sea2:#132123;--land:#a99a72}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--wood);color:var(--ink);font:16px/1.5 Spectral,Georgia,serif;overflow:hidden}
button{font:inherit;cursor:pointer}
.paper{background:var(--sheet);background-size:512px 512px,auto}
.gilt{position:relative;border:3px solid transparent;background-clip:padding-box;box-shadow:0 8px 22px #000a}
.gilt::before{content:"";position:absolute;inset:-3px;padding:3px;background:var(--gilt);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;border-radius:inherit}
.gilt::after{content:"";position:absolute;inset:3px;border:1px solid rgba(250,225,160,.35);pointer-events:none;border-radius:inherit}
.app{display:flex;flex-direction:column;height:100vh}
header{position:relative;z-index:6;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:start;gap:16px;padding:0 16px;height:72px;color:var(--ink);border-bottom:3px solid transparent;border-image:var(--gilt) 1;box-shadow:0 4px 14px #000a}
header .brand{display:flex;flex-direction:column;justify-content:center;height:68px}
header h1{font:400 25px/1 "IM Fell English SC",serif;margin:0;letter-spacing:.02em;color:#1a0e04;text-shadow:0 1px 0 rgba(255,235,180,.35)}
header .ver{font:italic 13px "IM Fell English",serif;color:var(--muted)}
.notches{display:flex;gap:6px;justify-content:safe center;height:84px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;padding:0 4px}
.notch{flex:none;width:54px;height:66px;margin-top:-3px;border-radius:0 0 12px 12px;display:flex;align-items:flex-end;justify-content:center;padding:0 0 7px;transition:transform .15s,height .15s;border:0}
.notch.gilt{border:3px solid transparent;border-top:0}
.notch.gilt::before{border-radius:0 0 13px 13px}
.notch svg{width:36px;height:36px;filter:drop-shadow(0 1px 0 rgba(255,235,180,.4))}
.notch:hover:not(:disabled){transform:translateY(3px)}
.notch.on{height:78px;background:var(--paperimg),linear-gradient(#c4a672,#a9895a);background-size:512px 512px,auto}
.notch.on::after{border-color:#8a1f1f;border-width:0 0 3px;inset:auto 8px 3px 8px}
.notch:disabled{cursor:default}
.notch:disabled .rivet{fill:#7a5c34;opacity:.5}
.notch:focus-visible{outline:2px solid #f2d98d;outline-offset:2px}
.stats{display:flex;gap:20px;align-items:center;height:68px}
.stat{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.stat b{font-weight:600;font-size:20px;color:#1a0e04;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat span{color:var(--muted);font:400 14px "IM Fell English",serif}
.stat small{font-size:12px;color:#2f4a1a;line-height:1;font-variant-numeric:tabular-nums}
.stat.bad b,.stat.bad small{color:#8a1f1f}
.dv{pointer-events:none}
.mapwrap{position:relative;flex:1;min-height:0;background:var(--sea);overflow:hidden}
#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab;transform-origin:0 0;will-change:transform}
#map.drag{cursor:grabbing}
.place{cursor:pointer}
.place text{font:600 10px Spectral,serif;fill:#2a1d12;paint-order:stroke;stroke:#efe2c4;stroke-width:3px;pointer-events:none}
.place:hover circle.seal{stroke:#fff;stroke-width:2.5}
.sealabel{font:italic 22px "IM Fell English",serif;fill:#b9cdc6;opacity:.45;pointer-events:none}
.cell{stroke:rgba(255,244,218,.2);stroke-width:.6;cursor:pointer;vector-effect:non-scaling-stroke}
.cell.sel{stroke:#fff;stroke-width:2}
.cell.tgt{stroke:#8a1f1f;stroke-width:1.6}
.cell.rt{stroke:#fff;stroke-width:2;stroke-dasharray:4 3}
#map.clean #devs,#map.clean #routes,#map.clean .place circle,#map.clean .place path{display:none}
#zclean .slash{display:none}#zclean[aria-pressed=true] .slash{display:inline}
.cell.dsel{stroke:#f6e7b8;stroke-width:1.6}
.cell.dadd{stroke:#f6e7b8;stroke-width:1.4;stroke-dasharray:3 3}
.dlabel{font-family:'IM Fell English SC','IM Fell English',serif;letter-spacing:.12em;text-transform:uppercase;fill:#2a1808;paint-order:stroke;stroke:#f2e3bd;stroke-width:2.2px;stroke-opacity:.7;text-anchor:middle;pointer-events:none}
.cell.col{stroke:#f0c850;stroke-width:2.6;fill:#e8c25a;fill-opacity:.28}
.toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(36,21,8,.92);color:#f0dcae;padding:8px 16px;border-radius:6px;font-size:15px;pointer-events:none;opacity:0;transition:opacity .25s;max-width:60%;text-align:center;z-index:4}
.toast.on{opacity:1}
.mapctl{position:absolute;right:12px;top:22px;display:flex;flex-direction:column;gap:8px;z-index:3}
.mapctl button{width:44px;height:44px;border-radius:6px;font-size:20px;color:var(--ink)}
.legend{position:absolute;left:12px;bottom:12px;border-radius:6px;padding:8px 10px;font-size:13px;max-width:220px;max-height:40%;overflow:auto;z-index:2}
.legend div{display:flex;align-items:center;gap:6px;line-height:1.35}
.legend i{width:11px;height:11px;border-radius:50%;display:inline-block;border:1px solid #0006;flex:none}
.card{position:absolute;right:68px;top:22px;width:290px;border-radius:8px;padding:12px 14px;display:none;z-index:3}
.card h3{margin:0 0 2px;font:400 22px "IM Fell English",serif}
.card .sub{color:var(--muted);font-size:14px;margin-bottom:8px}
.card .x,.page .x{position:absolute;right:6px;top:4px;border:0;background:none;font-size:24px;width:40px;height:40px;color:var(--muted);z-index:2}
.page{position:absolute;left:12px;top:22px;width:410px;max-height:calc(100% - 40px);border-radius:8px;display:none;flex-direction:column;z-index:4}
.page.open{display:flex;animation:drop .22s ease-out}
.page.wide{width:min(900px,calc(100% - 90px))}
.page.full{left:12px;right:12px;top:14px;bottom:14px;width:auto;max-height:none;z-index:7}
.page.full .panel{flex:1}
.page.full .tree{padding:14px 0 24px}
.treebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0 8px}
.treebar .zb{width:34px;height:34px;padding:0;border:1px solid #6b4a1e;border-radius:6px;background:rgba(255,240,205,.5);font:400 20px/1 serif;color:#3a240e;cursor:pointer}
.treebar .zb:hover{background:rgba(255,240,205,.85)}
.cityrow .btnrow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
@media (max-width:700px){.cityrow .btnrow{grid-template-columns:1fr}}
.treebar .btn{width:auto;flex:none;margin:0;padding:6px 14px}
.treebar .lin{flex:1;min-width:200px;font-size:13px;color:#3a240e}
.page.full .tree{height:max(320px,calc(100vh - 330px));border:1px solid #6b4a1e55;border-radius:6px;background:rgba(255,245,220,.18);cursor:grab}
.page.full .tree.drag{cursor:grabbing;user-select:none}
.tree>ul{padding:26px 30px 30px !important}
.pc[data-pid]{cursor:pointer}
.page.full .panel:has(.web){display:flex;flex-direction:column}
.page.full .panel:has(.web)>*{flex:none}
.page.full .panel:has(.web)>.web{flex:1 1 auto}
.web{min-height:340px;border:1px solid #6b4a1e55;border-radius:6px;background:rgba(255,245,220,.18)}
.web svg{width:100%;height:100%;display:block}
.web .wn{cursor:pointer}.web .wn:hover circle{stroke:#a3302a;stroke-width:2.5}
.web text{font:16px 'IM Fell English',serif;fill:#2a1808;text-anchor:middle;paint-order:stroke;stroke:#f2e3bd;stroke-width:3px;pointer-events:none}
.web .ini{font:700 15px serif;fill:#fff;stroke:none}
.weblegend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;margin:4px 0 8px}
.weblegend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:4px;vertical-align:-1px;border:1px solid #2a1808}
.pc[data-pid]:hover{box-shadow:0 0 0 2px #b8892d,0 2px 4px #0003}
.tree.lineage .pc{opacity:.32;filter:grayscale(.8)}
.tree.lineage .pc.blood{opacity:1;filter:none}
.tree.lineage .pc.blood.dead{opacity:.72;filter:grayscale(.4)}
.tree .pc.focus{box-shadow:0 0 0 3px #a3302a,0 3px 8px #0005}
.kgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:10px 0}
.kslot{border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center;background:rgba(255,235,190,.14)}
.kslot svg.helm{width:64px;height:64px;filter:drop-shadow(0 2px 2px #0006)}
.kslot .kname{font:400 18px/1.15 "IM Fell English",serif;margin:4px 0 6px;min-height:42px}
.kstat{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center;font-size:13px;text-align:left;margin:2px 0}
.pips{display:flex;gap:2px}.pips i{flex:1;height:7px;border-radius:2px;background:#0002}.pips i.on{background:#8a5a1a}.pips.loy i.on{background:#2f5a1a}.pips.int i.on{background:#2f4a7a}.pips.pop i.on{background:#8a1f1f}
.kslot.empty{opacity:.75}.kslot .btn{font-size:14px;min-height:38px;padding:6px 8px;text-align:center}
.aff{height:7px;background:#0002;border-radius:4px;overflow:hidden;margin:4px 0 6px}.aff i{display:block;height:100%;background:linear-gradient(90deg,#c9414a,#e07a8a)}
.btnrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.btnrow .btn{margin:0;font-size:14px;min-height:40px;padding:6px 8px}
.tree{overflow:auto;padding:4px 0 10px}
.tree ul{position:relative;display:flex;justify-content:safe center;padding:18px 0 0;margin:0;min-width:max-content}
.tree>ul{padding-top:0}
.tree li{list-style:none;position:relative;padding:18px 6px 0;text-align:center;flex:none}
.tree li::before,.tree li::after{content:"";position:absolute;top:0;right:50%;width:50%;height:18px;border-top:1.5px solid #6b4a1e}
.tree li::after{right:auto;left:50%;border-left:1.5px solid #6b4a1e}
.tree li:only-child::before,.tree li:only-child::after{display:none}
.tree li:only-child{padding-top:0}
.tree li:first-child::before,.tree li:last-child::after{border:0 none}
.tree li:last-child::before{border-right:1.5px solid #6b4a1e;border-radius:0 6px 0 0}
.tree li:first-child::after{border-radius:6px 0 0 0}
.tree ul ul::before{content:"";position:absolute;top:0;left:50%;height:18px;border-left:1.5px solid #6b4a1e}
.tree>ul>li{padding-top:0}.tree>ul>li::before,.tree>ul>li::after{display:none}
.couple{display:inline-flex;align-items:center;gap:4px}
.couple .hrt{color:#a3302a;font-size:16px}
.pc{position:relative;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;width:152px;height:84px;box-sizing:border-box;padding:6px 8px;border:1px solid #6b4a1e;border-radius:6px;background:rgba(255,240,205,.35);font-size:12px;line-height:1.25;box-shadow:0 2px 4px #0003;vertical-align:top}
.pc b{display:block;font:400 15px/1.15 "IM Fell English",serif}
.pc>b,.pc>.pcl,.pc>.tags{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc>.pcl{color:#4a3418}
.pc .crown{position:absolute;top:-11px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:1px;padding:0 3px;border-radius:6px;background:#f2e3bd;font:700 9.5px/1 serif;color:#6b4a1e;box-shadow:0 1px 2px #0004}
.pc .crown svg{width:18px;height:12px}
.tree li{padding-top:22px}
.tree li::before,.tree li::after{height:22px}
.couple{gap:6px}
.pc.ruler{border:2px solid #b8892d;background:rgba(250,225,150,.45)}
.pc.dead{opacity:.6;filter:grayscale(.5)}
.pc .tag{display:inline-block;margin-top:2px;padding:0 5px;border-radius:8px;background:#8a1f1f;color:#f6e7b8;font-size:11px}
.pc .tag.claim{background:#2f4a7a}.pc .tag.heir{background:#2f5a1a}
@keyframes drop{from{transform:translateY(-12px);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.page.open,#frame{animation:none!important}}
.panel{overflow-y:auto;padding:16px 18px 20px;flex:1}
.panel h2{font:400 28px/1.1 "IM Fell English SC",serif;margin:2px 40px 6px 0}
.panel h4{font:400 18px "IM Fell English",serif;margin:16px 0 6px;color:var(--accent)}
.row{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px dotted var(--line);font-size:15px}
.row span:last-child{font-variant-numeric:tabular-nums;text-align:right}
.btn{display:block;width:100%;text-align:left;margin:6px 0;padding:9px 12px;min-height:44px;border:1px solid #6b4a1e;border-radius:6px;background:linear-gradient(rgba(240,215,160,.35),rgba(120,85,40,.25));color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,240,200,.35)}
.btn small{display:block;color:var(--muted);font-size:13px}
.btn:hover:not(:disabled){background:linear-gradient(rgba(250,230,180,.55),rgba(140,100,50,.3))}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.red{border-color:var(--accent);color:var(--accent)}
.person{border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:6px 0;background:rgba(255,235,190,.12)}
.person b{font-weight:600}
.person .meta{font-size:13px;color:var(--muted)}
.log p{margin:0 0 6px;font-size:14px}.log p b{color:var(--accent);font-weight:600}
.plaque{position:absolute;right:12px;bottom:12px;display:flex;align-items:center;gap:14px;padding:10px 12px 10px 16px;border-radius:8px;z-index:3}
.plaque .note{display:block;font:400 14px "IM Fell English",serif;color:var(--muted)}
.ap{display:flex;gap:5px;flex-wrap:wrap;max-width:110px;margin-top:2px}
.ap.mar i{border-radius:2px;width:12px;height:12px;background:#4a5a2a}.ap i{width:16px;height:16px;border-radius:50%;background:var(--accent);border:1px solid #0006}.ap i.used{background:transparent!important}
.endyear{padding:10px 18px;min-height:44px;border-radius:6px;border:1px solid #3a0c0c;background:linear-gradient(#a3302a,#741818);color:#f6e7b8;font:400 18px "IM Fell English",serif;box-shadow:inset 0 1px 0 rgba(255,200,160,.35)}
.endyear:disabled{opacity:.5}
.cityview{position:fixed;inset:0;z-index:12;display:none;grid-template-columns:minmax(0,1fr) 400px;gap:14px;padding:16px;background:radial-gradient(ellipse at center,rgba(20,12,4,.82),rgba(8,5,2,.94))}
.cityview.open{display:grid}
.cmap{border-radius:8px;overflow:hidden;min-height:0;background:#7f8f58}
.cmap svg{width:100%;height:100%;display:block}
.cside{border-radius:8px;min-height:0;display:flex;flex-direction:column}
.cside .panel{position:relative}
.clab{font:600 12px Spectral,serif;fill:#2a1d12;paint-order:stroke;stroke:#efe2c4;stroke-width:3px}
.ctitle{font:400 34px "IM Fell English SC",serif;fill:#2a1d12;paint-order:stroke;stroke:#efe2c4;stroke-width:4px}
@media(max-width:900px){.cityview{grid-template-columns:1fr;grid-template-rows:45vh minmax(0,1fr);padding:8px;gap:8px}}
.modalbg{position:fixed;inset:0;background:radial-gradient(ellipse at center,#0007,#000e);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#frame{position:relative;width:min(560px,100%);max-height:92vh;display:flex;flex-direction:column;animation:unroll .35s ease-out;transform-origin:50% 0}
@keyframes unroll{from{transform:scaleY(.15);opacity:0}to{transform:none;opacity:1}}
.rod{display:block;height:24px;margin:0 -12px;border-radius:12px;flex:none;position:relative;z-index:2;background:linear-gradient(#efd48a,#a8741f 45%,#5a3a12 55%,#c99a3f);box-shadow:0 4px 8px #0008,inset 0 -2px 3px #0006}
.rod::before,.rod::after{content:"";position:absolute;top:-4px;width:18px;height:32px;border-radius:8px;background:linear-gradient(#f3d98f,#7a4f14);box-shadow:0 2px 4px #0006}
.rod::before{left:-9px}.rod::after{right:-9px}
.modal{flex:1;overflow:auto;margin:0 2px;padding:28px 34px 34px;color:var(--ink);border:1px solid #5a3f18;outline:1.5px solid #b8892d;outline-offset:-9px;background:var(--paperimg),radial-gradient(ellipse at 50% 0%,#c9ad7c,transparent 65%),linear-gradient(90deg,#937549,#b19366 10%,#b19366 90%,#937549);background-size:512px 512px,auto,auto}
.modal h2{font:400 31px/1.1 "IM Fell English SC",serif;margin:0;text-align:center;color:var(--ink);text-wrap:balance}
.modal h2::after{content:"\2766";display:block;font:20px/1 serif;color:#9a6a1f;margin:8px 0 14px}
.modal p{margin:0 0 10px}
.modal h2+p:not(.note)::first-letter{float:left;font:400 3.3em/.8 "IM Fell English SC",serif;color:#8a1f1f;padding:5px 8px 0 0}
.modal .btn{background:linear-gradient(90deg,transparent,#c9a45a33 20%,#c9a45a33 80%,transparent);border:0;border-top:1px solid #9a6a1f;border-bottom:1px solid #9a6a1f;border-radius:0;text-align:center;font:400 19px "IM Fell English",serif;color:var(--ink);margin:8px 0;box-shadow:none}
.modal .btn:hover:not(:disabled){background:linear-gradient(90deg,transparent,#c9a45a77 20%,#c9a45a77 80%,transparent)}
.modal .btn small{font:italic 14px Spectral,serif;color:#3a2410}
.modal .btn.red{color:#8a1f1f}
.seal{position:absolute;right:-4px;bottom:-14px;width:58px;height:58px;border-radius:50%;z-index:3;background:radial-gradient(circle at 35% 30%,#d24a3a,#8a1f1f 55%,#4a0f0f);box-shadow:0 5px 10px #000a,inset 0 0 0 4px #7a1818,inset 0 0 0 6px #b13a2c;display:flex;align-items:center;justify-content:center;font:400 26px "IM Fell English SC",serif;color:#e9b9a8;pointer-events:none}
.modal input,.modal select{font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--coast);border-radius:6px;background:#d6c194;width:100%;min-height:44px;color:var(--ink)}
.modal label{display:block;margin:10px 0 4px;font-size:15px;color:#3a2410}
.modal .note{color:#3a2410}
.realmgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;max-height:260px;overflow:auto;padding:2px}
.realmgrid button{color:var(--ink);font-family:"IM Fell English",serif;font-size:17px;padding:5px 8px;border:2px solid var(--line);border-radius:6px;background:rgba(255,235,190,.18);text-align:left;min-height:44px;line-height:1.15}
.realmgrid button.on{border-color:var(--accent);background:#d2bb8c}
.realmgrid i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.modal .realmgrid .note{color:#5a3d1e;font-family:Spectral,serif;font-size:12px}
.note{font-size:13px;color:var(--muted)}
#title{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px;background:radial-gradient(ellipse at 50% 35%,#4a3322,#1c120b 75%);color:#f0e0b8}
#title.hide{display:none}
#title svg.crown{width:min(220px,40vw);height:auto;filter:drop-shadow(0 6px 14px #000a)}
#title h1{font:400 clamp(40px,8vw,84px)/1 "IM Fell English SC",serif;margin:10px 0 4px;color:#f2d98d;text-shadow:0 3px 0 #000a;text-wrap:balance}
#title .tag{font:italic clamp(17px,2.4vw,24px) "IM Fell English",serif;color:#d9c293;margin:0 0 26px}
#title .menu{display:flex;flex-direction:column;gap:10px;width:min(320px,100%)}
#title .menu button{padding:12px 18px;min-height:48px;border:2px solid #b8892d;border-radius:6px;background:linear-gradient(#5b3a22,#3a2314);color:#f6e7b8;font:400 20px "IM Fell English",serif}
#title .menu button:hover:not(:disabled){background:linear-gradient(#7a4d2c,#4d2f1b)}

<script>
{
/* =====================================================================
   Crown & Dynasty — core build.
   Kept: map, tiles, fog & exploration, ships, seasons, gold, towns, war.
   Removed for rebuilding: realm management, court & family, armies,
   prestige, stability, colonies. Look for "HOOK:" comments.
   ===================================================================== */
const VERSION = "pre-alpha v0.2.9";
const SAVE_KEY = "crown-dynasty-save-v12";
const OLD_SAVE_KEYS = [];   // v0.1.3 reworked people, armies and the court; older saves do not carry over
const $ = id => document.getElementById(id);
const R = (a,b) => a + Math.random()*(b-a);
const RI = (a,b) => Math.floor(R(a,b+1));
const pick = a => a[Math.floor(Math.random()*a.length)];
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));

const REALMS = {
 albion:{name:"Albion",color:"#b03a2e",dyn:"Ashcombe"},
 wessmark:{name:"Wessmark",color:"#2cbe67",dyn:"Thornbury"},
 cymria:{name:"Cymria",color:"#9b39c5",dyn:"ap Rhydderch"},
 estanglia:{name:"Estanglia",color:"#9e9d37",dyn:"Wulfstan"},
 northumbra:{name:"Northumbra",color:"#2c94be",dyn:"Ravensworth"},
 caledon:{name:"Caledon",color:"#c53974",dyn:"MacAldair"},
 strathmore:{name:"Strathmore",color:"#459e37",dyn:"Dunvegan"},
 eirland:{name:"Eirland",color:"#432cbe",dyn:"Ó Ríain"},
 mumhan:{name:"Mumhan",color:"#c57839",dyn:"Mac Carthaigh"},
 bretonne:{name:"Bretonne",color:"#379e84",dyn:"de Kerval"},
 valoria:{name:"Valoria",color:"#be2cb8",dyn:"de Valois-Mer"},
 nordmere:{name:"Nordmere",color:"#97c539",dyn:"Fitzhrolf"},
 artesia:{name:"Artesia",color:"#375e9e",dyn:"d'Artois-Lande"},
 champaine:{name:"Champaine",color:"#be2c39",dyn:"de Brienne"},
 aurelle:{name:"Aurelle",color:"#39c555",dyn:"d'Aurignac"},
 pictavia:{name:"Pictavia",color:"#6a379e",dyn:"de Lusignan"},
 occitane:{name:"Occitane",color:"#be9e2c",dyn:"de Tolosa"},
 bourgmont:{name:"Bourgmont",color:"#39bac5",dyn:"de Charolle"},
 lyonesse:{name:"Lyonesse",color:"#9e3778",dyn:"de Forez"},
 alpenmark:{name:"Alpenmark",color:"#5dbe2c",dyn:"von Kyburg"},
 arlesia:{name:"Arlesia",color:"#3940c5",dyn:"di Montalba"},
 lowmark:{name:"Lowmark",color:"#9e5037",dyn:"van Oorde"},
 hollandt:{name:"Hollandt",color:"#2cbe7a",dyn:"van Egmont"},
 ardenne:{name:"Ardenne",color:"#ad39c5",dyn:"de la Marck"},
 rhinemark:{name:"Rhinemark",color:"#929e37",dyn:"von Arnsberg"},
 treverland:{name:"Treverland",color:"#2c82be",dyn:"von Isenburg"},
 alsatia:{name:"Alsatia",color:"#c53962",dyn:"von Lützel"},
 palatine:{name:"The Palatine",color:"#389e37",dyn:"von Wittelsbrunn"},
 saxmark:{name:"Saxmark",color:"#562cbe",dyn:"Billunger"},
 daneholm:{name:"Daneholm",color:"#c58a39",dyn:"Skjoldung"},
 slesmark:{name:"Slesmark",color:"#379e91",dyn:"Abelsen"},
 castamar:{name:"Castamar",color:"#be2ca6",dyn:"de Lara"},
 navarra:{name:"Navarra",color:"#85c539",dyn:"de Foix-Evreux"},
 asturia:{name:"Asturia",color:"#37519e",dyn:"de Quirós"}
};
const MALE = ["Edmund","Henric","Aldric","Godfrey","Rowan","Tristan","Lionel","Percival","Osric","Gerard","Baldwin","Arthur","Geoffrey","Roland","Thibault","Florian","Anselm","Rodrigo","Lothar","Magnus","Casimir","Hugo","Alaric","Bertrand","Conrad","Diarmait","Eamon","Fulk","Guiscard","Harald","Ivo","Joscelin","Leofric","Malcolm","Niall","Odo","Raymond","Sancho","Tancred","Ulric","Waleran"];
const FEMALE = ["Isolde","Matilda","Eleanor","Rosamund","Beatrix","Cecily","Margery","Adela","Sibyl","Gwendolyn","Elise","Clémence","Odette","Joan","Agnes","Blanche","Ingrid","Leonor","Mathilde","Aveline","Yolande","Hedwig","Ermengarde","Gisela","Urraca","Sigrid","Brígh","Ysabeau"];
const EPITHETS = ["the Bold","the Pious","the Fair","the Young","the Lame","the Wise","the Stern","the Generous","the Lion","the Unready","the Black","the Red","the Good","the Cruel","the Fat","the Learned","Ironhand","the Builder","the Quiet","Longshanks"];
const HOUSES = ["Varne","Mortaigne","Halloway","Corbeau","Ostrand","Dauvergne","Penhallow","Riesen","Blackmere","Montclair","Valdric","Hartwell","Lisieux","Strandberg","Croix-Haute","Aubrac","Rosenthal","Kervignac","Wendmoor","Saint-Clair","Falkenrode","Ormesby","Belcastel","Ruthven","Torvald","Grimaud"];
const SEA_RANGE = 430;
const DEEDS_PER_SEASON = 3;
let COLONY_PICK = null;
let ROUTE = null;
let DEDIT = null, DUKEPICK = null;   // district being edited on the map ("new" while founding one); district choosing a duke         // {from: tile} while a road crew is laying trade routes   // id of the harbour city whose colonists are choosing a shore

let S = null;            // game state
let page = null;   // which notch page is open
let selected = null;
let vb = {x:0,y:0,w:1000,h:800};
const pr = () => S.realms[S.player];
const ruler = () => S.people[S.rulerId];
const rulerTitle = () => ruler().gender==="m" ? "King" : "Queen";
function randomRuler(house){ const gender = Math.random()<0.82 ? "m" : "f"; return {name:pick(gender==="m"?MALE:FEMALE), gender, epithet: Math.random()<0.55 ? pick(EPITHETS) : "", house: house || pick(HOUSES), age: RI(24,58)}; }
const rulerOf = rid => rid===S.player ? `${rulerTitle()} ${ruler().name} of House ${S.dynasty}` : (()=>{ const r=S.realms[rid].ruler; return `${r.gender==="m"?"King":"Queen"} ${r.name}${r.epithet?" "+r.epithet:""} of House ${r.house}`; })();

/* ---------- setup ---------- */
function newGame(realmId, name, gender, dyn){
 S = {version:VERSION, year:1500, season:0, player:realmId, gold:300, food:80, res:60, devs:{}, starving:0, ap:DEEDS_PER_SEASON, marches:0,
  dynasty:dyn, people:{}, rulerId:null, founderId:null, spouseId:null, spouseAff:0, heirId:null, suitors:[], suitorsT:-99, allies:{}, knights:[], acts:{},
  tax:"fair", relief:0, trade:{}, homes:CELLS.map(c=>c[1]),
  explored:{}, seen:[], expeditions:[], log:[], over:false, nextId:1, places:[], realms:{}, events:[]};
 const me = newPerson({name, gender, born:1500-20, house:dyn, origin:realmId, ruled:[1500,null]});
 S.rulerId = S.founderId = me.id; createElders(me, realmId);
 S.places = PLACES_RAW.map((p,k) => ({id:p.id,name:p.name,x:p.x,y:p.y,owner:p.realm,dev:1,base:p.capital?CAPITAL_PEOPLE:CITY_PEOPLE,fort:1,port:!!p.port,capital:!!p.capital,tile:TOWNCELL[k]}));
 S.tiles = CELLS.map(c => c[4] && c[1]>=0 ? PLACES_RAW[c[1]].realm : null);
 S.seen = CELLS.map(()=>0);
 for(const [id,r] of Object.entries(REALMS)){
  const n = S.places.filter(p=>p.owner===id).length;
  S.realms[id] = {id, name:r.name, color:r.color, gold:80*n, food:80, res:60, alive:true, atWar:[], truce:{}, warStart:{}, lost:{}, ruler: id===realmId ? null : randomRuler(), knights: Array.from({length:KNIGHT_SLOTS},()=>newKnight())};
 }
 S.knights = Array.from({length:KNIGHT_SLOTS},()=>newKnight());
 assignPowers(true); syncTowns(); seedFarms();
 S.marches = maxMarches(); updateSight();
 log(`${rulerTitle()} ${name} of House ${dyn} is crowned sovereign of ${pr().name}.`);
 save(); render(); goHome(false);
}

/* ---------- geometry & power ---------- */
const owned = rid => S.places.filter(p=>p.owner===rid);
const dist = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
const placeIdx = p => S.places.indexOf(p);
const tileOfTown = p => p.tile;
let TOWNAT = new Map();   // tile index -> town index; rebuilt when towns are founded
function syncTowns(){ if(!S) return; if(S.people && S.founderId && !S.eldersDone && person(S.founderId) && person(S.founderId).father==null) createElders(person(S.founderId), S.player); S.eldersDone=true; if(!S.homes) S.homes = CELLS.map(c=>c[1]); S.trade ||= {}; S.tax ||= "fair"; if(S.tiles && S.realms && Object.values(S.realms).some(r=>r.id!==S.player && r.might==null)) assignPowers(false);
 if(S.tiles && (S.routes==null || Object.values(S.realms||{}).some(r=>r.alive && r.id!==S.player && r.routes==null))){ TOWNAT = new Map(S.places.map((p,k)=>[p.tile ?? TOWNCELL[k],k])); if(S.routes==null){ S.routes=[]; autoRoutes(); } for(const r of Object.values(S.realms)) if(r.id!==S.player && r.routes==null){ r.routes=[]; r.food??=80; r.res??=60; autoRoutes(r.id); } } S.relief ??= 0; S.places.forEach((p,k)=>{ if(p.tile==null) p.tile = TOWNCELL[k]; if(p.pop==null) p.pop = townPeople(p); cityInit(p); fleetInit(p); }); TOWNAT = new Map(S.places.map((p,k)=>[p.tile,k])); if(S.tiles && S.homes) autoDistricts(); }
const tileCount = rid => S.tiles.reduce((n,t)=>n+(t===rid),0);
const tileAdj = (rid,i) => NEI[i].some(j=>S.tiles[j]===rid);
function reachable(rid, place){
 if(place.owner===rid) return false;
 if(tileAdj(rid, tileOfTown(place))) return true;
 if(place.port && owned(rid).some(m => m.port && dist(m,place) <= SEA_RANGE)) return true;
 return false;
}
function neighbours(rid){
 const set=new Set();
 for(let i=0;i<S.tiles.length;i++) if(S.tiles[i]===rid) for(const j of NEI[i]){ const o=S.tiles[j]; if(o && o!==rid) set.add(o); }
 for(const o of Object.keys(S.realms)) if(o!==rid && S.realms[o].alive && !set.has(o) && owned(o).some(p=>reachable(rid,p))) set.add(o);
 return [...set].filter(o=>S.realms[o].alive);
}
// HOOK: placeholder military strength, derived from land held (no army system yet).
/* Armies: up to a third of a kingdom's people can be called to war. Knights rally them — popular knights
   bring more militants (disloyal ones only half) — and intelligent, strong knights make them better fighters. */
const KNIGHT_SLOTS = 3, LEVY_SHARE = 1/3;
const knightsOf = rid => (rid===S.player ? S.knights : S.realms[rid].knights) || [];
function armyOf(rid){
 const people = economy(rid,false).people, max = Math.floor(people*LEVY_SHARE), ks = knightsOf(rid).filter(Boolean);
 const CB = cityBonus(rid);
 const rally = clamp(ks.reduce((s,k)=>s + k.pop*(k.loy<4?0.5:1), 0)/(10*KNIGHT_SLOTS) + CB.rally, 0, 1);
 const quality = 1 + ks.reduce((s,k)=>s + k.int + 0.6*k.str, 0)/(16*KNIGHT_SLOTS) + CB.quality;
 const troops = Math.round(max*rally);
 return {people, max, troops, rally, quality, strength: Math.round(troops*quality*(rid===S.player ? 1 : (S.realms[rid]?.might ?? 1)))};
}
const strength = rid => armyOf(rid).strength;
/* Power: every other kingdom is dealt a random might (army strength and wealth) and temper (appetite for war). */
const POWER = [{name:"Feeble",m:0.6,w:2},{name:"Weak",m:0.8,w:3},{name:"Middling",m:1.0,w:4},{name:"Strong",m:1.25,w:3},{name:"Mighty",m:1.55,w:2}];
function rollPower(cap){ const pool=POWER.filter(p=>p.m<=cap); let t=Math.random()*pool.reduce((a,p)=>a+p.w,0); for(const p of pool){ t-=p.w; if(t<=0) return +(p.m*R(0.93,1.07)).toFixed(2); } return 1; }
const relName = r => { const v=r.rel||0; return `${v>0?"+":""}${v} (${v>=50?"friendly":v>=20?"warm":v>-20?"neutral":v>-50?"cool":"hostile"})`; };
const powerName = r => r.might==null ? "" : r.might>=1.4 ? "Mighty" : r.might>=1.12 ? "Strong" : r.might>=0.9 ? "Middling" : r.might>=0.7 ? "Weak" : "Feeble";
function assignPowers(fresh){
 const nb = new Set(neighboursByLand(S.player));
 for(const r of Object.values(S.realms)){ if(r.id===S.player || r.might!=null) continue;
  r.might = rollPower(nb.has(r.id) ? 1.3 : 9);   // no mighty realm starts on our doorstep
  r.temper = +R(0.5,1.6).toFixed(2);
  if(!fresh) continue;
  r.gold = Math.round(r.gold*r.might);
  const cap = owned(r.id).find(p=>p.capital); if(cap && r.might>=1.12){ cap.dev += r.might>=1.4?2:1; cap.pop = null; }
  // strong realms start with more land, taken from the wilds around them
  let n = Math.max(0, Math.round((r.might-0.85)*10));
  while(n-->0){ const w=[]; for(let i=0;i<S.tiles.length;i++) if(S.tiles[i]===null && tileAdj(r.id,i)) w.push(i); if(!w.length) break; S.tiles[pick(w)] = r.id; }
 }
}
function neighboursByLand(rid){ const set=new Set(); for(let i=0;i<S.tiles.length;i++) if(S.tiles[i]===rid) for(const j of NEI[i]){ const o=S.tiles[j]; if(o && o!==rid) set.add(o); } return [...set]; }
// HOOK: marches per season are flat until an army system exists.
const maxMarches = () => S.season===3 ? 2 : 3;
/* ---------- economy (per season) ----------
   Gold:      +3 for every tile held, +1 for every 50 people, plus gold mines.
   Food:      farms and fisheries grow it; every 100 people eat 1 (rounded up).
   People:    towns hold 100 per level of development; villages add more as they grow.
   Resources: only held land with nothing built on it yields them (+1 a tile). Every building costs resources,
              so some land must be left wild to keep building. */
const GOLD_PER_TILE = 3, PEOPLE_PER_GOLD = 50, PEOPLE_PER_FOOD = 100, RES_PER_WILD_TILE = 1;
const MINE = [null, {lvl:"I",gold:25,g:180,r:85}, {lvl:"II",gold:15,g:120,r:60}, {lvl:"III",gold:10,g:80,r:40}, {lvl:"IV",gold:5,g:60,r:25}];   // index = mine level; IV is the first built, I the richest
// Village stages: 1 = village, 2 = market village; a grown market village can be raised into a new city.
const CAPITAL_PEOPLE = 1000, CITY_PEOPLE = 700, PEOPLE_PER_DEV = 150;
const townPeople = p => (p.base || (p.capital?CAPITAL_PEOPLE:CITY_PEOPLE)) + PEOPLE_PER_DEV*(p.dev-1);   // a town's capacity
/* Deaths: war and famine kill people in a realm's towns (the named town first). Every town keeps at least
   MIN_TOWN_PEOPLE, and towns slowly refill towards their capacity while their people are fed. */
const MIN_TOWN_PEOPLE = 100, REGROW = 0.03;
function killPeople(rid, n, place){
 n = Math.round(n); if(n<=0) return 0; const towns = owned(rid); if(!towns.length) return 0;
 let left = n;
 if(place && place.owner===rid){ const t = Math.min(left, Math.floor(place.pop*0.5), Math.max(0, place.pop-MIN_TOWN_PEOPLE)); place.pop -= t; left -= t; }
 for(let pass=0; pass<3 && left>0; pass++){
  const room = towns.reduce((s,t)=>s+Math.max(0,t.pop-MIN_TOWN_PEOPLE),0); if(room<=0) break;
  for(const t of towns){ const take = Math.min(Math.max(0,t.pop-MIN_TOWN_PEOPLE), Math.ceil(left*Math.max(0,t.pop-MIN_TOWN_PEOPLE)/room)); t.pop -= take; left -= take; if(left<=0) break; } }
 const dead = n - Math.max(0,left); if(rid===S.player) S.dead = (S.dead||0) + dead; return dead;
}
function regrow(rid){ for(const t of owned(rid)){ if(t.hungryT===turn()) continue; const cap=Math.min(townPeople(t), t.houses!=null ? t.houses*100 : Infinity); if(t.pop<cap) t.pop = Math.min(cap, t.pop + Math.ceil(townPeople(t)*(typeof regrowRate==='function'?regrowRate(t):REGROW)*(t.owner===S.player ? taxOf().regrow*(relief()?1.25:1) : 1))); } }
const VILLAGE = [null, {name:"Village", people:150, grow:6, farms:1, up:{g:80,r:60,label:"Raise to a market village"}}, {name:"Market village", people:400, grow:8, farms:2, up:{g:150,r:100,label:"Found a new city"}}];
const DEV = {
 farm:   {name:"Farm",      food:6, g:40, r:15, blurb:"+6 food a season · near a village or city"},
 fish:   {name:"Fishery",   food:5, g:30, r:12, blurb:"+5 food a season · coast, near a village or city", coastal:true},
 village:{name:"Village",   g:80, r:50, blurb:`+${VILLAGE[1].people} people (taxes +${VILLAGE[1].people/PEOPLE_PER_GOLD} gold) · needs a farm next to it · grows into a market village, then a city of ${CITY_PEOPLE}`},
 mine:   {name:"Gold mine", g:MINE[4].g, r:MINE[4].r, blurb:`+${MINE[4].gold} gold a season at level IV, up to +${MINE[1].gold} at level I · near a village or city`}
};
const TOWNCOST = { develop:p=>({g:Math.round(100*Math.pow(2,p.dev-1)), r:Math.round(20*Math.pow(2,p.dev-1))}),   // doubles with every level
 fortify:p=>({g:90*p.fort, r:15*p.fort}), ships:{g:150, r:40} };
const isCoastal = i => CELLS[i][5]===1;
/* Terrain of every tile, assigned from real elevation, satellite land-cover and wetland data (tools/terrain.py). */
const TERRAIN_TYPES = {p:"plains", f:"forest", m:"mountain", c:"coastal", a:"marsh", s:"swamp"};
const terrainOf = i => TERRAIN_TYPES[TERRAIN[i]];
/* Developments: S.devs[tile] = {village:{lvl,grow}} or any mix of {farm:{}, fish:{}, mine:{lvl}}.
   A village stands alone on its tile; farms, fisheries and mines may share a tile (one of each)
   and must lie within SUPPORT_RANGE tiles of a village or city we own. */
const SUPPORT_RANGE = 2, DEV_ORDER = ["village","farm","fish","mine"], WORKS = ["farm","fish","mine"];
const devsAt = i => S.devs[i] || {};
const hasDevs = i => !!S.devs[i] && Object.keys(S.devs[i]).length>0;

function expStatus(e){

/* Line of succession: the proclaimed heir, then the sovereign's other children eldest first, then their children by the eldest line. */
function successionLine(){ const r=ruler(); if(!r) return []; const L=[], by=(a,b)=>a.born-b.born, kids=r.children.map(person).filter(Boolean).sort(by);

/* Other kingdoms play by our rules: every build or upgrade costs gold and resources and takes one of their

function aiFoundCity(r, i){

function relTo(p, r){   // how p is related to the sovereign r

 if(cl.length){ h += `<h4>Claims by blood</h4>`; for(const x of cl) h += `<div class="row"><span>${x.name}</span><span>${claimants(x.id).map(p=>p.name).join(", ")} · ruler aged ${x.ruler.age}</span></div>`; }

/* =====================================================================
   City view: a drawn map of each of our cities, with buildings.
   Layout (roads, house plots, building sites, coast) is generated from the
   city's own seed, so every city looks different but stays the same.
   ===================================================================== */
const PEOPLE_PER_HOUSE = 100, HOUSE_COST = 25;
const CASTLE = [null,

 {name:"Stone keep",       g:400, def:300},
 {name:"Curtain-walled castle", g:800, def:500},
 {name:"Royal palace",     g:1500, def:750}];
const BLD = {
 blacksmith:{name:"Blacksmith", g:120, blurb:"Arms the militants: fighting quality +0.08 (up to three smithies count)"},
 barracks:  {name:"Barracks",   g:160, blurb:"Drills the levy: knights rally 6% more militants (up to three count)"},
 market:    {name:"Market",     g:150, blurb:"+12 gold a season"},
 tavern:    {name:"Tavern",     g:80,  blurb:"+6 gold a season, and the town regrows a little faster"},
 mill:      {name:"Mill",       g:90,  blurb:"+4 food a season"},

};
const FORT_NAME = ["", "No walls", "Wooden palisade", "Stone walls and towers", "Great walls and a moat"];
const housing = p => (p.houses||0)*PEOPLE_PER_HOUSE;
const housesNeeded = p => Math.ceil((p.pop ?? townPeople(p))/PEOPLE_PER_HOUSE);
function cityInit(p){ if(p.seed==null) p.seed = Math.floor(Math.random()*2**31); if(p.houses==null) p.houses = Math.ceil((p.pop ?? townPeople(p))/PEOPLE_PER_HOUSE); if(!p.bld) p.bld = {}; }
function cityBonus(rid){   // realm-wide effects of city buildings

 for(const p of owned(rid)){ const b=p.bld||{};
  if(b.market) B.gold+=12; if(b.tavern) B.gold+=6; if(b.harbour){ B.gold+=6; B.food+=3; } if(b.mill) B.food+=4;
  if(b.blacksmith) smiths++; if(b.barracks) barracks++; }

}
const regrowRate = p => REGROW + (p.bld?.tavern?0.01:0) + (p.bld?.chapel?0.01:0);
function housingSeason(summary){
 for(const p of S.places){ if(!S.realms[p.owner]?.alive) continue; cityInit(p);
  if(p.owner!==S.player){ p.houses = Math.max(p.houses, Math.ceil(townPeople(p)/PEOPLE_PER_HOUSE)); continue; }   // other realms keep their people housed
  const room = housing(p);
  if(p.pop > room){ const leave = Math.ceil((p.pop-room)*0.25); p.pop -= leave; S.left=(S.left||0)+leave;
   summary.push(`<b>${leave.toLocaleString()} people left ${p.name}</b> with no roof over their heads. Build more houses there.`); }
 }
}
/* ---------- actions ---------- */
function actHouses(p, n){ cityInit(p); const free = cityLayout(p).houseSlots - p.houses; n = Math.min(n, free); if(n<=0 || S.over || S.gold < n*HOUSE_COST) return; S.gold -= n*HOUSE_COST; p.houses += n; toast(`${n} new house${n>1?"s":""} raised in ${p.name}.`); after(); }
function actCastle(p){ cityInit(p); const nx=(p.bld.castle||0)+1, c=CASTLE[nx]; if(!c || S.over || S.gold<c.g) return; S.gold-=c.g; p.bld.castle=nx; log(`${nx===1?"A":"The"} ${c.name.toLowerCase()} ${nx===1?"is raised":"now crowns"} ${p.name}.`, true); after(); }
function renderFleet(p){
 const cap=fleetCap(p), tot=fleetTotal(p), sea=shipsAtSea(p), C=COLONY;
 let h = `<h4>The fleet</h4><div class="row"><span>Ships at the quays</span><span>${p.fleet||0}${sea?` · ${sea} at sea`:""}${p.keel!=null?` · one on the slipway, ready ${when(p.keel)}`:""}</span></div><div class="row"><span>Moorings</span><span>${cap} ship${cap>1?"s":""}${p.bld.harbour?"":" · a harbour moors "+FLEET_CAP_HARBOUR}</span></div>`;
 h += btn("Lay down a ship", p.keel!=null?"The shipwrights are busy until next season":tot>=cap?(p.bld.harbour?"Every mooring is taken":"Build a harbour to keep more than one ship"):`${SHIP.g} gold, ${SHIP.r} resources · ready next season`, ()=>actBuildShip(p), S.over||p.keel!=null||tot>=cap||!canPay(SHIP.g,SHIP.r));

 for(const [k,ok,v] of colonyNeeds(p)) h += `<div class="row"><span>${ok?"✓ ":""}${k}</span><span style="color:${ok?"#2f5a1a":"#8a1f1f"}">${v}</span></div>`;

 h += btn("Choose a shore for the colony", colonyReady(p)?"Pick unclaimed coast on the map · sailing takes 1 deed":"Gather everything above first", ()=>actChooseShore(p), S.over||!colonyReady(p));

function actBuilding(p, k){ cityInit(p); const b=BLD[k]; if(!b || p.bld[k] || (b.port && !p.port) || S.over || S.gold<b.g) return; S.gold-=b.g; p.bld[k]=1; toast(`A ${b.name.toLowerCase()} opens in ${p.name}.`); after(); }

/* ---------- layout ---------- */
function rngFrom(seed){ let a=seed>>>0; return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

function seaAngle(p){ cellInit(); const [x,y]=CELLC[p.tile], ns=NEI[p.tile]; if(!ns.length) return Math.atan2(y-400,x-500);

  sea={a, d, nx, ny, pts}; }

 // roads
 const roads=[]; const add=(pts,w)=>{ const keep=[]; for(const q of pts){ if(inSea(q[0],q[1])) break; keep.push(q); } if(keep.length>1) roads.push({pts:keep,w}); };
 const gates = 3 + Math.floor(r()*3), rot = r()*Math.PI*2, mains=[];
 for(let g=0; g<gates; g++){ let a = rot + g*2*Math.PI/gates + (r()-.5)*0.6; if(sea && Math.cos(a-sea.a)>0.55) a += Math.PI*0.5;
  const pts=[[CX+Math.cos(a)*24, CY+Math.sin(a)*24]]; let ang=a;
  for(let d=60; d<=R+260; d+=55){ ang += (r()-.5)*(pattern==="winding"?0.5:0.18); const last=pts[pts.length-1]; pts.push([last[0]+Math.cos(ang)*55, last[1]+Math.sin(ang)*55]); }
  add(pts,15); mains.push(a); }
 if(pattern==="grid"){ const sp=52+r()*18, rr=r()*Math.PI, cs=Math.cos(rr), sn=Math.sin(rr);
  for(let k=-6;k<=6;k++){ for(const dir of [0,1]){ const pts=[]; for(let t=-R;t<=R;t+=18){ const u=k*sp+(r()-.5)*6, v=t; const x=dir?u:v, y=dir?v:u; const X=CX+x*cs-y*sn, Y=CY+x*sn+y*cs; if(Math.hypot(X-CX,Y-CY)<R*0.98) pts.push([X,Y]); else if(pts.length) break; } if(pts.length>3) add(pts,9); } } }
 else if(pattern==="radial"){ for(const f of [0.45,0.78]){ const rr=R*f, a0=r()*Math.PI*2, span=Math.PI*(1.2+r()*0.8), pts=[]; for(let t=0;t<=span;t+=0.12){ const a=a0+t; pts.push([CX+Math.cos(a)*rr*(1+(r()-.5)*0.06), CY+Math.sin(a)*rr*(1+(r()-.5)*0.06)]); } add(pts,10); }
  for(const a of mains) for(let d=R*0.25; d<R*0.95; d+=36+r()*30){ const side=r()<.5?-1:1, b=a+side*(Math.PI/2+(r()-.5)*0.6), sx=CX+Math.cos(a)*d, sy=CY+Math.sin(a)*d, L=40+r()*70, pts=[[sx,sy]]; let ang=b; for(let s=22;s<=L;s+=22){ ang+=(r()-.5)*0.4; const q=pts[pts.length-1]; pts.push([q[0]+Math.cos(ang)*22, q[1]+Math.sin(ang)*22]); } add(pts,9); } }
 else { const grow=(x,y,a,depth)=>{ const pts=[[x,y]]; let ang=a, L=50+r()*90; for(let s=18;s<=L;s+=18){ ang+=(r()-.5)*0.7; const q=pts[pts.length-1], nx2=q[0]+Math.cos(ang)*18, ny2=q[1]+Math.sin(ang)*18; if(Math.hypot(nx2-CX,ny2-CY)>R) break; pts.push([nx2,ny2]); } add(pts,9);

  for(const a of mains) for(let d=R*0.38; d<R*0.92; d+=70+r()*50) grow(CX+Math.cos(a)*d, CY+Math.sin(a)*d, a+(r()<.5?-1:1)*(Math.PI/2+(r()-.5)*0.5), 1); }

 for(let tries=0; tries<1400 && sites.length<8; tries++){ const a=r()*Math.PI*2, d=48+r()*r()*R*0.62, x=CX+Math.cos(a)*d, y=CY+Math.sin(a)*d;
  if(inSea(x,y) || !clearOfRoads(x,y,20) || !nearRoad(x,y) || Math.hypot(x-castle[0],y-castle[1])<80 || sites.some(s=>Math.hypot(s[0]-x,s[1]-y)<56)) continue; sites.push([x,y]); }
 for(const rd of roads) for(let k=1;k<rd.pts.length;k++){ const [ax,ay]=rd.pts[k-1], [bx,by]=rd.pts[k], L=Math.hypot(bx-ax,by-ay), ang=Math.atan2(by-ay,bx-ax);
  for(let t=8;t<L;t+=17) for(const side of [-1,1]){ const off=rd.w/2+9, x=ax+(bx-ax)*t/L - Math.sin(ang)*off*side, y=ay+(by-ay)*t/L + Math.cos(ang)*off*side;
   const dc=Math.hypot(x-CX,y-CY); if(dc<34 || dc>R*1.02 || inSea(x,y) || Math.hypot(x-castle[0],y-castle[1])<70 || sites.some(s=>Math.hypot(s[0]-x,s[1]-y)<30) || !clearOfRoads(x,y,5) || plots.some(q=>Math.hypot(q[0]-x,q[1]-y)<15.5)) continue;
   plots.push([x,y,ang*180/Math.PI,Math.floor(r()*3)]); } }
 sites.sort((a,b)=>Math.hypot(a[0]-CX,a[1]-CY)-Math.hypot(b[0]-CX,b[1]-CY));     // the town centre takes the community buildings
 plots.sort((a,b)=>Math.hypot(b[0]-CX,b[1]-CY)-Math.hypot(a[0]-CX,a[1]-CY));     // houses fill in from the outskirts towards the centre
 // farmland strips outside the town
 const fields=[]; for(let k=0;k<26;k++){ const a=r()*Math.PI*2, d=R+60+r()*260, x=CX+Math.cos(a)*d, y=CY+Math.sin(a)*d; if(inSea(x,y)||!clearOfRoads(x,y,30)) continue; fields.push([x,y,a*180/Math.PI+90+(r()-.5)*40, 50+r()*60, 26+r()*30, Math.floor(r()*4)]); }
 const wallPts=[]; const WN=16; for(let k=0;k<WN;k++){ const a=k/WN*Math.PI*2, rr=R+16+(r()-.5)*16; wallPts.push([CX+Math.cos(a)*rr, CY+Math.sin(a)*rr]); }
 const L={R, pattern, sea, roads, sites, plots, fields, castle, wallPts, mains, houseSlots:plots.length};

}

function drawWalls(L, fort){

function actEmergencyLevy(){

 modal({title:"An Emergency Levy", body:`<p>Tax collectors ride out with armed escorts. The treasury gains <b>${g} gold</b>, but about ${left} people pack up and leave, and every knight's loyalty falls by one.</p>`}); after();

const tradeValue = rid => 6 + 3*Math.min(owned(S.player).length, owned(rid).length);

function actOpenTrade(rid){

 if(S.allies[rid] || Math.random()<clamp(0.7+(r.rel||0)/200,0.2,0.98)){ r.rel=clamp((r.rel||0)+5,-100,100); S.trade[rid]={since:turn(), bought:-1}; log(`A trade agreement is signed with ${r.name}.`, true); toast(`Merchants from ${r.name} arrive: +${tradeValue(rid)} gold a season.`); }

/* countryside follows the nearest city; ties go to the older city */
function rehome(newIdx){

 for(let i=0;i<CELLS.length;i++){
  if(COMP[i]!==comp) continue; const [x,y]=CELLC[i], dn=Math.hypot(x-c.x,y-c.y); if(dn>140) continue;
  const h=S.homes[i]; if(h===newIdx) continue;
  if(h<0 || h==null){ S.homes[i]=newIdx; continue; }
  const o=S.places[h], d0=Math.hypot(x-o.x,y-o.y);

const SEGS = [];
function tileSegs(i){ if(SEGS[i]) return SEGS[i]; const set=new Set(); for(const ring of CELLS[i][0].split("M").slice(1)){ const pts=[...ring.matchAll(/(-?[\d.]+) (-?[\d.]+)/g)].map(m=>m[1]+","+m[2]); for(let k=0;k<pts.length;k++){ const a=pts[k], b=pts[(k+1)%pts.length]; set.add(a<b?a+"|"+b:b+"|"+a); } } return SEGS[i]=set; }

  for(const j of NEI[i]){ const o=S.tiles[j]; if(!o || !allies[o]) continue; const A=tileSegs(i), B=tileSegs(j);

function noiseURL(size, cells, octaves, rgb, aMin, aMax, seed){
 let sd=seed; const rnd=()=>{ sd=(sd*16807)%2147483647; return sd/2147483647; };
 const cv=document.createElement("canvas"); cv.width=cv.height=size; const cx=cv.getContext("2d"); const img=cx.createImageData(size,size);
 const layers=[]; for(let o=0;o<octaves;o++){ const n=cells*(1<<o); const g=Array.from({length:n*n},rnd); layers.push([n,g]); }
 const sm=t=>t*t*(3-2*t);
 for(let y=0;y<size;y++) for(let x=0;x<size;x++){
  let v=0, amp=1, tot=0;
  for(const [n,g] of layers){ const fx=x/size*n, fy=y/size*n, x0=Math.floor(fx), y0=Math.floor(fy), tx=sm(fx-x0), ty=sm(fy-y0);
   const G=(i,j)=>g[((j+n)%n)*n+((i+n)%n)];
   const a=G(x0,y0)+(G(x0+1,y0)-G(x0,y0))*tx, b=G(x0,y0+1)+(G(x0+1,y0+1)-G(x0,y0+1))*tx;
   v+=(a+(b-a)*ty)*amp; tot+=amp; amp*=0.5; }
  v/=tot; const k=(y*size+x)*4; img.data[k]=rgb[0]; img.data[k+1]=rgb[1]; img.data[k+2]=rgb[2]; img.data[k+3]=Math.round(255*(aMin+(aMax-aMin)*clamp((v-0.25)/0.5,0,1)));
 }
 cx.putImageData(img,0,0); return cv.toDataURL();
}

 }
}
let anim=null;
const PS = () => Math.min(1, Math.pow(vb.w/1000, .85)).toFixed(3);
let LODK=-1, vbPending=false;
function setLOD(){ const k = vb.w>620?0 : vb.w>260?1 : 2; if(k===LODK) return; LODK=k; const d=[LAND_LO,LAND_MID,LAND_PATH][k]; for(const id of ["lfill","lpaper","lcoast"]){ const el=$(id); if(el) el.setAttribute("d",d); } }
let vbC=null, commitT=0;
function fitOf(b, cw, ch){ const s=Math.min(cw/b.w, ch/b.h); return {s, ox:(cw-b.w*s)/2, oy:(ch-b.h*s)/2}; }
function applyLive(){
 const svg=$("map"); if(!vbC) return setVB();
 const cw=svg.clientWidth, ch=svg.clientHeight; if(!cw||!ch) return setVB();
 const a=fitOf(vbC,cw,ch), b=fitOf(vb,cw,ch), k=b.s/a.s;
 const tx=b.ox - k*a.ox + (vbC.x-vb.x)*b.s, ty=b.oy - k*a.oy + (vbC.y-vb.y)*b.s;
 svg.style.transform=`translate(${tx}px,${ty}px) scale(${k})`;
}
function setVBsoon(delay=170){ applyLive(); clearTimeout(commitT); if(delay>=0) commitT=setTimeout(setVB, delay); }
function setVB(){ clearTimeout(commitT); setLOD(); vbC={...vb}; $("map").style.transform=""; $("map").setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`); const k=PS(); for(const g of document.querySelectorAll("#places .place, #devs .dv")) g.setAttribute("transform",`translate(${g.dataset.x},${g.dataset.y}) scale(${k})`); $("dlabels")?.setAttribute("font-size", (8*k).toFixed(2)); }
function aspect(){ const r=$("map").getBoundingClientRect(); return (r.width>10&&r.height>10)? r.width/r.height : 1.25; }
const maxW = () => Math.max(1000, 800*aspect());
function clampBox(b){ if(b.w>=1300) b.x=(1000-b.w)/2; else b.x=clamp(b.x,-150,1150-b.w); if(b.h>=1000) b.y=(800-b.h)/2; else b.y=clamp(b.y,-100,900-b.h); return b; }
function clampVB(){ clampBox(vb); }
function zoom(f, cx, cy){
 const A=aspect(), nw = clamp(vb.w*f, 90, maxW()), nh = nw/A;

 vb.x = cx - (cx-vb.x)*(nw/vb.w); vb.y = cy - (cy-vb.y)*(nh/vb.h); vb.w=nw; vb.h=nh; clampVB(); setVBsoon();
}
function fitAspect(){ const A=aspect(), cx=vb.x+vb.w/2, cy=vb.y+vb.h/2; vb.w=clamp(vb.w,90,maxW()); vb.h=vb.w/A; vb.x=cx-vb.w/2; vb.y=cy-vb.h/2; clampVB(); setVB(); }
function homeTarget(){
 const ps = S ? owned(S.player) : []; const A=aspect();
 if(!ps.length){ const w=maxW(); return clampBox({x:500-w/2,y:400-w/A/2,w,h:w/A}); }
 const xs=ps.map(p=>p.x), ys=ps.map(p=>p.y), x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys);
 let w = Math.max(x1-x0+200, (y1-y0+160)*A); w = clamp(w,260,maxW()); const h=w/A;

function animateTo(t, ms=850){
 cancelAnimationFrame(anim);
 if(matchMedia("(prefers-reduced-motion: reduce)").matches || ms<=0){ vb={...t}; setVB(); return; }
 const f={...vb}, t0=performance.now(), ease=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
 const step=now=>{ const u=Math.min(1,(now-t0)/ms), e=ease(u), A=aspect();
  const lw=Math.exp(Math.log(f.w)+(Math.log(t.w)-Math.log(f.w))*e);
  const cx=(f.x+f.w/2)+((t.x+t.w/2)-(f.x+f.w/2))*e, cy=(f.y+f.h/2)+((t.y+t.h/2)-(f.y+f.h/2))*e;

function goHome(animated=true){ animateTo(homeTarget(), animated?850:0); }
function svgPoint(e){ const svg=$("map"), pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY; return pt.matrixTransform(svg.getScreenCTM().inverse()); }
function bindMap(){
 const svg=$("map"); let drag=null, moved=0;
 svg.addEventListener("wheel", e=>{ e.preventDefault(); cancelAnimationFrame(anim); const p=svgPoint(e); zoom(e.deltaY>0?1.15:0.87, p.x, p.y); }, {passive:false});
 svg.addEventListener("pointerdown", e=>{ cancelAnimationFrame(anim); drag={x:e.clientX,y:e.clientY,vx:vb.x,vy:vb.y}; moved=0; });
 window.addEventListener("pointermove", e=>{ if(!drag) return; const s=Math.max(vb.w/svg.clientWidth, vb.h/svg.clientHeight);
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y; moved=Math.max(moved,Math.abs(dx)+Math.abs(dy)); if(moved>4){ svg.classList.add("drag"); vb.x=drag.vx-dx*s; vb.y=drag.vy-dy*s; clampVB(); setVBsoon(-1); } });
 window.addEventListener("pointerup", e=>{ if(drag && moved>4) setVB(); if(drag && moved<=4){ const g=e.target.closest&&e.target.closest(".place"); const cl=e.target.closest&&e.target.closest(".cell"); const mineTown = id => { const q=S.places.find(x=>x.id===id); return q && q.owner===S.player; };
 const rtile = g ? S.places.find(x=>x.id===g.dataset.id)?.tile : cl ? +cl.dataset.i : null;
 if(DEDIT && rtile!=null && S.tiles[rtile]===S.player){ actDistrictTile(rtile); }
 else if(ROUTE && rtile!=null && S.tiles[rtile]===S.player){ actLayRoute(rtile); }
 else if(g){ if(mineTown(g.dataset.id)){ selected=null; openCity(g.dataset.id); render(); } else { selected=g.dataset.id; render(); } } else if(cl){ const ci=+cl.dataset.i; if(COLONY_PICK && colonyTarget(ci)) selected="col:"+ci; else if(fogged(ci)) selected="fog:"+ci; else if(TOWNAT.has(ci)){ const id=S.places[TOWNAT.get(ci)].id; if(mineTown(id)){ selected=null; openCity(id); } else selected=id; } else selected="tile:"+ci; render(); } } drag=null; svg.classList.remove("drag"); });
 { const setClean=on=>{ $("map").classList.toggle("clean",on); $("zclean").setAttribute("aria-pressed",on); $("zclean").title=on?"Show icons again":"Hide icons: show only city names and borders"; try{ localStorage.setItem("crown-dynasty-clean", on?"1":""); }catch(e){} };
  let on=false; try{ on=localStorage.getItem("crown-dynasty-clean")==="1"; }catch(e){} setClean(on);
  $("zclean").onclick=()=>setClean(!$("map").classList.contains("clean")); }
 $("zin").onclick=()=>zoom(0.75); $("zout").onclick=()=>zoom(1.33); $("zreset").onclick=()=>goHome(true);
 new ResizeObserver(()=>fitAspect()).observe($("map").parentElement); fitAspect();
}

 modal({title:"Crown &amp; Dynasty", body:`<p class="note">${VERSION} · Europe, anno Domini 1500</p>

(function paperTexture(){
 const N=512, cv=document.createElement("canvas"); cv.width=cv.height=N; const cx=cv.getContext("2d");

 const done=()=>{ if(++n<2) return;
  cx.drawImage(blot,0,0,N,N); cx.drawImage(fine,0,0,N,N);
  let sd=42; const rnd=()=>{ sd=(sd*16807)%2147483647; return sd/2147483647; };
  for(let i=0;i<900;i++){ const x=rnd()*N, y=rnd()*N, a=rnd()*Math.PI, l=4+rnd()*14; cx.strokeStyle=`rgba(${rnd()<.5?"60,38,15":"240,220,175"},${.05+rnd()*.08})`; cx.lineWidth=.6; cx.beginPath(); cx.moveTo(x,y); cx.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l); cx.stroke(); }
  for(let i=0;i<500;i++){ cx.fillStyle=`rgba(50,30,10,${.06+rnd()*.12})`; cx.beginPath(); cx.arc(rnd()*N,rnd()*N,rnd()*1.2+.2,0,7); cx.fill(); }
  document.documentElement.style.setProperty("--paperimg", `url(${cv.toDataURL()})`); };

$("thow").onclick = () => modal({title:"How to Rule", body:`<p>The notches along the top open your pages: the map and spyglass for exploration, crossed swords for war, hearts for romance and the scroll for your chronicle. Each year has four seasons. Each season you have three <b>deeds</b> for work on the main map (building or upgrading a village, farm, fishery or mine, chartering a city, exploring, sending colonists, declaring war or peace, assaulting a town) and a few <b>marches</b> for claiming or occupying single tiles of land.</p><p>Every tile you hold pays 3 gold a season, and every 50 people pay 1 more. Land you leave wild yields <b>resources</b>, which every building needs, so keep some land undeveloped. Click one of your tiles to build a <b>village</b> (more people and taxes; it grows into a market village and then a new city), a <b>farm</b> or <b>fishery</b> (coast only) for food, or a <b>gold mine</b> you can dig from level IV (+5 gold) down to level I (+25). Farms, fisheries and mines must be within two tiles of one of your villages or cities, and one tile can hold several of them, but a village needs a tile to itself. Click one of your cities to walk its streets: build houses (every 100 people need one), a castle, blacksmiths, markets, mills and more, develop it and fortify its walls. Work inside a city needs no deeds. A port city builds ships at its quays; with a harbour it can keep a fleet, and a fleet of five with settlers, gold and resources stored in the city can sail off to found a colony on an unclaimed coast. <b>Trade routes</b>, the thin white lines on the map, join neighbouring lands into chains that link your cities and villages; each segment costs 5 gold and needs no deed. Farms, fisheries, mines and wild land send their goods to the nearest city or village within two tiles, and harbour cities are linked by sea. Only the network holding your capital fills the royal granary and stores: a city or village cut off from it lives on its own farms and goes hungry if they fall short. War and famine kill people, and towns only slowly refill. Every 100 people eat 1 food a season, and every village needs a farm beside it (a market village two) or it is abandoned; if the granaries run dry, your people starve.</p><p>Up to a third of your people can be called to war. Your three <b>knights</b> rally them — popular knights raise more militants, and intelligent, strong ones make them fight better. Set taxes, feed the poor and trade with neighbours from the <b>Treasury</b>. Court <b>suitors</b> on the Romance page: a match from another kingdom brings an alliance, and children of that blood may one day inherit its crown. The <b>family tree</b> follows your bloodline.</p><p>The world beyond your borders is hidden in fog. Send scouts overland, or a ship from a port city over the sea; voyages take several seasons. Press <b>End Season</b> to let time pass.</p>`});
